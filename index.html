<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffedd6">
<title>우리반 광장</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  --bg:#fff3dc; --bg2:#ffe9c7; --panel:#ffffff; --ink:#2b2250; --muted:#6a5f8c; --line:#e7cfa6;
  --red:#ff5a6a; --orange:#ff9f1c; --yellow:#ffd23e; --green:#3ec46d; --teal:#17c2b0; --blue:#4ea8ff; --purple:#9b6bff; --pink:#ff6fb5;
  --cyan:#17c2b0; --r:20px; --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
  --shadow:0 4px 0 rgba(43,34,80,.14), 0 10px 24px rgba(43,34,80,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
html,body{margin:0;height:100%}
body{background:
  radial-gradient(900px 500px at 15% -10%,#ffe0ec,transparent 60%),
  radial-gradient(900px 500px at 100% 0,#dff0ff,transparent 55%),
  linear-gradient(180deg,#fff6e3,#ffedd6) fixed, var(--bg);
  color:var(--ink);font:15.5px/1.55 "Pretendard Variable","Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  overflow-x:hidden;word-break:keep-all;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
img,canvas{max-width:100%}
.hidden{display:none!important}
.fun{font-family:"Jua","Pretendard Variable",system-ui,sans-serif;font-weight:400;letter-spacing:.3px}
h1,h2,.big-title,.auth-card h1,.dest-card h3,.logo-big,.plaza-hero h1{font-family:"Jua","Pretendard Variable",system-ui,sans-serif;font-weight:400}
.wrap{max-width:720px;margin:0 auto;padding:calc(14px + var(--st)) 16px calc(28px + var(--sb))}

/* 공통 버튼 */
.btn{display:block;width:100%;background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;border-radius:16px;padding:15px;font-size:18px;font-weight:800;text-align:center;box-shadow:var(--shadow);font-family:"Jua",sans-serif}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(43,34,80,.14),0 4px 10px rgba(43,34,80,.12)}
.btn.sm{display:inline-block;width:auto;padding:11px 20px;font-size:16px}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.warn{background:linear-gradient(135deg,var(--red),var(--orange));color:#fff}
.btn.green{background:linear-gradient(135deg,var(--green),var(--teal))}
.btn.blue{background:linear-gradient(135deg,var(--blue),var(--purple))}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700}
.chip b{color:var(--purple)}
.ghost-x{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 13px;font-size:14px;color:var(--ink);font-weight:700}
.ghost-x:active{transform:translateY(2px)}
input,textarea,select{width:100%;background:#fff;border:2px solid var(--line);color:var(--ink);border-radius:14px;padding:13px 15px;font-size:16px;outline:none}
input:focus,textarea:focus{border-color:var(--purple)}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--sb));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;z-index:300;font-size:14px;font-weight:700;opacity:0;transition:.25s;max-width:90vw;text-align:center;box-shadow:var(--shadow)}
.toast.show{opacity:1}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:14px}
.empty{text-align:center;color:var(--muted);padding:34px 16px;border:3px dashed var(--line);border-radius:18px;background:#fffdf7;font-weight:600}

/* 로그인 */
#auth{min-height:100svh;display:grid;place-items:center;padding:24px}
.auth-card{width:100%;max-width:390px;background:#fff;border:3px solid #fff;border-radius:28px;padding:30px 24px;text-align:center;box-shadow:0 10px 0 rgba(255,159,28,.25),0 24px 60px rgba(43,34,80,.18)}
.logo-big{width:84px;height:84px;margin:0 auto 10px;border-radius:26px;background:linear-gradient(135deg,var(--yellow),var(--orange));display:grid;place-items:center;font-size:44px;box-shadow:0 6px 0 rgba(255,159,28,.35);transform:rotate(-5deg)}
.auth-card h1{font-size:34px;margin:6px 0 2px}
.auth-card .sub{color:var(--muted);margin-bottom:20px;font-size:14px;font-weight:600}
.field{text-align:left;margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin:0 0 5px 4px;font-weight:700}
.field .small{font-size:11px;color:var(--muted)}
.auth-card .btn{margin-top:6px}

/* 상단바 */
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.topbar h2{font-size:20px;margin:0;flex:1}
.me-chip{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;background:#fff;border:2px solid var(--line);border-radius:14px;padding:5px 11px}
.me-nick{font-size:15px;font-weight:800}
.me-name{font-size:11px;color:var(--muted)}

/* 광장 */
.plaza-hero{text-align:center;padding:10px 0 20px}
.plaza-hero .logo-big{width:70px;height:70px;font-size:38px}
.plaza-hero h1{font-size:30px;margin:10px 0 2px}
.plaza-hero p{color:var(--muted);margin:0;font-size:14px;font-weight:600}
.dest{display:grid;gap:16px}
.dest-card{position:relative;overflow:hidden;border-radius:26px;padding:22px;text-align:left;color:#fff;box-shadow:var(--shadow);transform:rotate(var(--tilt,0deg));transition:transform .15s}
.dest-card:active{transform:rotate(0) translateY(3px)}
.dest-card .emoji{font-size:50px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2))}
.dest-card h3{margin:10px 0 4px;font-size:26px;text-shadow:0 2px 4px rgba(0,0,0,.18)}
.dest-card p{margin:0;font-size:14px;opacity:1;line-height:1.5;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.22)}
.dest-quiz{background:linear-gradient(135deg,#ff6fb5,#ff5a6a)}
.dest-solo{background:linear-gradient(135deg,#f59000,#ef7016)}
.dest-board{background:linear-gradient(135deg,#36c6ff,#5a7bff)}
.dest-card::after{content:"→";position:absolute;top:22px;right:24px;font-size:26px;opacity:.85;font-weight:900}
.dest-card::before{content:"";position:absolute;right:-20px;bottom:-30px;width:130px;height:130px;background:rgba(255,255,255,.14);border-radius:50%}

/* 학생 목록 */
.roster-card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:16px;box-shadow:var(--shadow)}
.roster-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.roster-head b{font-size:15px}
.students{display:flex;flex-wrap:wrap;gap:7px}
.student{background:var(--bg2);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:5px}
.student .nm{font-size:10px;color:var(--muted);font-weight:600}
.student.me{border-color:var(--purple);background:#f3ecff}

/* 탭 */
.tabs{display:flex;gap:6px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:5px;margin-bottom:14px;box-shadow:var(--shadow)}
.tabs button{flex:1;padding:11px;border-radius:12px;font-size:14px;font-weight:800;color:var(--muted)}
.tabs button.on{background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff}

.card{background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:16px}
.row{display:flex;gap:8px;align-items:center}
.sync{font-size:12px;color:var(--muted);text-align:center;margin-top:12px;font-weight:600}
.sync .on{color:var(--green)} .sync .off{color:var(--orange)}

/* 투표 */
.poll .opt{display:flex;align-items:center;gap:10px;margin:7px 0;position:relative;background:#fff8ec;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.poll .opt .fill{position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,111,181,.25),rgba(155,107,255,.22));width:0;transition:width .4s}
.poll .opt button.pick{position:relative;flex:1;text-align:left;padding:12px 14px;font-weight:700;font-size:15px}
.poll .opt .cnt{position:relative;padding:0 14px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--purple)}
.poll .opt.mine{border-color:var(--purple)}
.poll .q{font-weight:800;font-size:17px;margin-bottom:10px;font-family:"Jua",sans-serif}
.poll .meta{font-size:12px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between;font-weight:600}

/* D-day */
.dday{display:flex;align-items:center;gap:14px}
.dday .num{font-size:32px;font-weight:900;min-width:82px;text-align:center;color:var(--red);font-variant-numeric:tabular-nums;font-family:"Jua",sans-serif}
.dday .num.past{color:var(--muted)}
.dday .info{flex:1}.dday .info b{font-size:16px}.dday .info .date{font-size:12px;color:var(--muted)}

/* 꾸미기 벽 */
#wall{position:relative;width:100%;height:62vh;min-height:420px;background:
  radial-gradient(circle at 10px 10px,rgba(43,34,80,.05) 2px,transparent 2px) 0 0/26px 26px,
  linear-gradient(180deg,#fff7e6,#ffeed2);
  border:3px solid #fff;border-radius:20px;overflow:hidden;touch-action:none;user-select:none;box-shadow:inset 0 2px 8px rgba(43,34,80,.08),var(--shadow)}
.wall-item{position:absolute;max-width:170px;cursor:grab;filter:drop-shadow(0 5px 8px rgba(43,34,80,.25))}
.wall-item.sticker{font-size:46px;line-height:1}
.wall-item.note{color:#4a3a00;border-radius:6px;padding:10px 12px;font-size:13.5px;font-weight:700;transform:rotate(var(--rot,-2deg));min-width:88px;word-break:break-word;line-height:1.4;box-shadow:0 4px 8px rgba(43,34,80,.2);background:var(--note,#ffe27a)}
.wall-item.note .by{display:block;font-size:10px;opacity:.6;margin-top:4px;font-weight:600}
.wall-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.wall-toolbar button{background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 13px;font-size:14px;font-weight:700;box-shadow:var(--shadow)}
.wall-toolbar button:active{transform:translateY(2px)}
.sticker-pick{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.sticker-pick button{font-size:28px;padding:7px;border-radius:12px}
.sticker-pick button:active{background:var(--bg2)}
.color-pick{display:flex;gap:8px;justify-content:center;margin:10px 0}
.color-pick button{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2)}

/* 모달 */
.modal{position:fixed;inset:0;z-index:200;background:rgba(43,34,80,.45);backdrop-filter:blur(4px);display:grid;place-items:center;padding:18px}
.modal-card{width:100%;max-width:410px;background:#fff;border-radius:26px;padding:24px;max-height:88svh;overflow:auto;box-shadow:0 20px 60px rgba(43,34,80,.35)}
.modal-card h3{margin:0 0 14px;font-size:20px;font-family:"Jua",sans-serif}
.modal-card .btn{margin-top:14px}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
.modal-card{animation:pop .2s cubic-bezier(.2,1.5,.4,1)}

/* 전체화면 게임/배틀 */
.screen{position:fixed;inset:0;z-index:150;background:linear-gradient(180deg,#fff6e3,#ffedd6);display:flex;flex-direction:column;padding-top:var(--st);padding-bottom:var(--sb)}
.sc-top{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:2px solid var(--line)}
.sc-top h2{margin:0;font-size:18px;flex:1;font-family:"Jua",sans-serif}
.sc-body{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center;gap:14px}
.stage{width:100%;max-width:440px;margin:0 auto}
.statbar{display:flex;gap:18px;justify-content:center;font-size:14px;color:var(--muted);font-weight:700}
.statbar b{color:var(--ink);font-size:22px;font-variant-numeric:tabular-nums;font-family:"Jua",sans-serif}
.tap-area{width:100%;max-width:440px;height:240px;border-radius:22px;display:grid;place-items:center;font-size:24px;font-weight:800;user-select:none;border:3px solid #fff;box-shadow:var(--shadow);font-family:"Jua",sans-serif}
canvas.game{background:#eafaff;border-radius:16px;border:3px solid #fff;touch-action:none;box-shadow:var(--shadow)}
.big-title{font-size:32px;font-weight:800;font-family:"Jua",sans-serif}
.code-box{font-size:38px;font-weight:900;letter-spacing:8px;color:var(--purple);background:#fff;border:3px dashed var(--purple);border-radius:18px;padding:16px;margin:10px 0;font-family:"Jua",sans-serif}
.player-chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:10px 0}
.pchip{background:#fff;border:2px solid var(--line);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:800;box-shadow:var(--shadow)}
.rank-list{text-align:left;width:100%;max-width:400px;margin:0 auto}
.rank-row{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:14px;margin-bottom:7px;background:#fff;border:2px solid var(--line);box-shadow:var(--shadow)}
.rank-row.me{background:#f3ecff;border-color:var(--purple)}
.rank-row .rk{width:32px;text-align:center;font-weight:900;color:var(--muted);font-family:"Jua",sans-serif}
.rank-row:nth-child(1) .rk{color:var(--orange)}
.rank-row .nm{flex:1;font-weight:800}.rank-row .nm small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.rank-row .pt{font-weight:900;color:var(--purple);font-variant-numeric:tabular-nums;font-family:"Jua",sans-serif}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;width:100%}
.pick-item{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px;text-align:center;box-shadow:var(--shadow)}
.pick-item.on{border-color:var(--purple);background:#f7f2ff}
.pick-item .pe{font-size:32px}.pick-item .pn{font-size:14px;font-weight:800;margin-top:6px}.pick-item .pd{font-size:11px;color:var(--muted);margin-top:2px}
.countdown{font-size:84px;font-weight:900;color:var(--orange);font-family:"Jua",sans-serif;animation:bump .4s}
@keyframes bump{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.trivia-opt{display:block;width:100%;background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px;font-size:17px;font-weight:700;margin-bottom:10px;text-align:left;box-shadow:var(--shadow)}
.trivia-opt.correct{background:#e4ffe9;border-color:var(--green)}
.trivia-opt.wrong{background:#ffe6e9;border-color:var(--red)}
.trivia-opt:disabled{opacity:.9}

/* 혼자 연습: 게임 그리드 + 보상 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.game-card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:15px;text-align:left;box-shadow:var(--shadow);transition:transform .12s}
.game-card:active{transform:translateY(3px)}
.game-card .emoji{font-size:36px}
.game-card h3{margin:9px 0 2px;font-size:16px;font-family:"Jua",sans-serif}
.game-card p{margin:0;color:var(--muted);font-size:12px;min-height:30px;font-weight:600}
.game-card .best{margin-top:7px;font-size:12px;color:var(--orange);font-weight:800;min-height:15px}
.sec-title{display:flex;align-items:center;gap:8px;margin:22px 2px 12px;font-size:14px;color:var(--muted);font-weight:800}
.sec-title::after{content:"";flex:1;height:2px;background:var(--line);border-radius:2px}
.reward-strip{margin:4px 0 2px}
.rs-lv{background:#fff;border:2px solid var(--line);border-radius:16px;padding:13px 16px;box-shadow:var(--shadow)}
.rs-head{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);font-weight:600}
.rs-head b{color:var(--ink);font-size:16px;font-family:"Jua",sans-serif}
.rs-bar{height:11px;background:var(--bg2);border-radius:999px;overflow:hidden;margin:9px 0 4px}
.rs-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--orange));border-radius:999px;transition:width .5s}
.rs-sub{font-size:11px;color:var(--muted);font-weight:600}
.reward-pop{margin-top:12px;background:#fff6dc;border:2px solid #f0b000;color:#7a4e00;border-radius:12px;padding:10px;font-weight:800;font-size:14px}
.badge-win{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.badge-win span{background:var(--purple);color:#fff;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:800;animation:pop .3s}
.badge-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.bdg{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 4px;opacity:.45;filter:grayscale(1)}
.bdg.on{opacity:1;filter:none;border-color:var(--orange);background:#fff8e8}
.bdg .be{font-size:26px}.bdg .bn{font-size:10px;color:var(--muted);margin-top:3px;font-weight:700}.bdg.on .bn{color:var(--ink)}
.result{position:fixed;inset:0;z-index:180;background:rgba(43,34,80,.5);backdrop-filter:blur(5px);display:grid;place-items:center;padding:20px}
.result-card{width:100%;max-width:420px;background:#fff;border-radius:26px;padding:24px;text-align:center;box-shadow:0 20px 60px rgba(43,34,80,.4);animation:pop .22s cubic-bezier(.2,1.5,.4,1);max-height:90svh;overflow:auto}
.result-card .score{font-size:48px;font-weight:900;color:var(--purple);margin:4px 0;font-family:"Jua",sans-serif}
.result-card .label{color:var(--muted);font-weight:700}
.row-btns{display:flex;gap:10px;margin-top:18px}.row-btns .btn{margin:0}
.lb{margin-top:16px;text-align:left}
.lb-row{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:12px;font-size:14px}
.lb-row.me{background:#f3ecff;border:2px solid var(--purple)}
.lb-rank{width:26px;text-align:center;font-weight:900;color:var(--muted)}
.lb-row:nth-child(1) .lb-rank{color:var(--orange)}
.lb-name{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-score{font-weight:900;font-variant-numeric:tabular-nums}
.lb-empty{color:var(--muted);text-align:center;padding:16px;font-size:13px}
</style>
</head>
<body>

<!-- 로그인 -->
<section id="auth">
  <div class="auth-card">
    <div class="logo-big">🏫</div>
    <h1>우리반 광장</h1>
    <div class="sub">친구들과 퀴즈 배틀 · 게시판 꾸미기</div>
    <div class="field">
      <label>닉네임 <span class="small">(게임에서 크게 보여요)</span></label>
      <input id="nickInput" maxlength="10" placeholder="예: 번개맨" autocomplete="off">
    </div>
    <div class="field">
      <label>이름 <span class="small">(작게 표시 · 누군지 알아보게)</span></label>
      <input id="nameInput" maxlength="10" placeholder="예: 김민수" autocomplete="off">
    </div>
    <button class="btn" id="startBtn">광장 입장</button>
  </div>
</section>

<!-- 광장 -->
<main id="plaza" class="wrap hidden">
  <div class="topbar">
    <h2>🏫 우리반 광장</h2>
    <div class="me-chip"><span class="me-nick" id="meNick"></span><span class="me-name" id="meName"></span></div>
    <button class="ghost-x" id="logoutBtn">나가기</button>
  </div>
  <div class="plaza-hero">
    <div class="logo-big">🏫</div>
    <h1>어디로 갈까?</h1>
    <p>친구들과 같이 즐겨요</p>
  </div>
  <div class="dest">
    <button class="dest-card dest-quiz" data-go="quiz" style="--tilt:-1.2deg">
      <div class="emoji">⚔️</div><h3>다 같이 대결</h3>
      <p>방 코드로 모여서 퀴즈 배틀 · 그림 맞히기! 여러 게임을 라운드로 겨뤄요.</p>
    </button>
    <button class="dest-card dest-solo" data-go="solo" style="--tilt:1deg">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
'use strict';
/* =======================================================================
   우리반 광장 — 퀴즈 배틀 + 게시판(투표·D-day·꾸미기)
   서버: 아래 두 줄에 Supabase 주소/anon 키 (타이포 앱과 같은 서버 OK).
   비우면 이 기기 안에서만(여러 탭끼리) 동작. 표는 class_setup.sql 참고.
   ======================================================================= */
const SUPABASE_URL = 'https://uziciteusfmbreuizudi.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV6aWNpdGV1c2ZtYnJldWl6dWRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4OTM4NjAsImV4cCI6MjEwNzQ2OTg2MH0.ogXVIA347KqKnpzR6B3X0c1e4xkH6Mkja0rpC-K_2Bk';

/* ---------- 유틸 ---------- */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const el = (t,c,h) => { const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; };
const rand=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rand(a,b+1));
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sleep = ms => new Promise(r=>setTimeout(r,ms));
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1900); }
function code4(){ const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<4;i++)s+=c[ri(0,c.length-1)]; return s; }

/* ---------- 네트워크 계층 (Supabase 폴링 + 로컬 대체) ----------
   roomSet/roomGet: 배틀 방 상태(호스트만 씀) · emit/pull: 참가자 이벤트
   boardList/boardAdd/boardUpdate/boardDel: 게시판 아이템(투표·dday·쪽지·스티커·표) */
const Net = {
  sb:null, online:false, bc:null,
  async init(){
    if(SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase){
      try{ this.sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY); this.online=true; }catch(e){ this.online=false; }
    }
    if(!this.online){ try{ this.bc=new BroadcastChannel('cls'); }catch(e){} }
  },
  // ---- 로컬 저장 헬퍼 ----
  _lget(k,d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d; }catch(e){ return d; } },
  _lset(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} if(this.bc) try{ this.bc.postMessage(k); }catch(e){} },
  // ---- 배틀 방 ----
  async roomSet(code,data){
    data=JSON.parse(JSON.stringify(data));
    if(this.online){ await this.sb.from('cls_rooms').upsert({code,data,updated_at:new Date().toISOString()}); return; }
    this._lset('cls_room_'+code, data);
  },
  async roomGet(code){
    if(this.online){ const q=await this.sb.from('cls_rooms').select('data').eq('code',code).maybeSingle(); return q.data?q.data.data:null; }
    return this._lget('cls_room_'+code, null);
  },
  async emit(code,data){
    const ev={code, data, ts:Date.now()+Math.random()};
    if(this.online){ await this.sb.from('cls_events').insert({code, data}); return; }
    const L=this._lget('cls_ev_'+code, []); L.push(ev); this._lset('cls_ev_'+code, L.slice(-500));
  },
  async pull(code, since){
    if(this.online){ const q=await this.sb.from('cls_events').select('id,data,created_at').eq('code',code).gt('id', since||0).order('id'); return (q.data||[]).map(r=>({id:r.id,data:r.data,ts:Date.parse(r.created_at)})); }
    const L=this._lget('cls_ev_'+code, []); return L.filter(e=>e.ts>(since||0)).map(e=>({id:e.ts,data:e.data,ts:e.ts}));
  },
  // ---- 게시판 ----
  async boardList(){
    if(this.online){ const q=await this.sb.from('cls_board').select('*').order('id'); return (q.data||[]).map(r=>({id:r.id,kind:r.kind,data:r.data,nick:r.by_nick,name:r.by_name})); }
    return this._lget('cls_board', []);
  },
  async boardAdd(kind,data,nick,name){
    if(this.online){ const q=await this.sb.from('cls_board').insert({kind,data,by_nick:nick,by_name:name}).select('id').single(); return q.data?q.data.id:null; }
    const L=this._lget('cls_board', []); const id='b'+Date.now()+Math.floor(Math.random()*999); L.push({id,kind,data,nick,name}); this._lset('cls_board', L); return id;
  },
  async boardUpdate(id,data){
    if(this.online){ await this.sb.from('cls_board').update({data}).eq('id',id); return; }
    const L=this._lget('cls_board', []); const it=L.find(x=>x.id===id); if(it){ it.data=data; this._lset('cls_board', L); }
  },
  async boardDel(id){
    if(this.online){ await this.sb.from('cls_board').delete().eq('id',id); return; }
    this._lset('cls_board', this._lget('cls_board', []).filter(x=>x.id!==id));
  },
  // ---- 학생 목록 ----
  async studentUpsert(nick,name){
    if(this.online){ try{ await this.sb.from('cls_students').upsert({nick,name,seen_at:new Date().toISOString()},{onConflict:'nick'}); }catch(e){} return; }
    const L=this._lget('cls_students', {}); L[nick]={nick,name,seen:Date.now()}; this._lset('cls_students', L);
  },
  async studentList(){
    if(this.online){ const q=await this.sb.from('cls_students').select('nick,name,seen_at').order('seen_at',{ascending:false}).limit(200); return (q.data||[]).map(r=>({nick:r.nick,name:r.name,seen:Date.parse(r.seen_at)})); }
    return Object.values(this._lget('cls_students', {})).sort((a,b)=>b.seen-a.seen);
  },
  // ---- 혼자 연습 랭킹 ----
  async scoreSubmit(game,nick,name,score){
    if(this.online){ try{ await this.sb.from('cls_scores').insert({game,nick,name,score}); }catch(e){} return; }
    const L=this._lget('cls_scores', []); L.push({game,nick,name,score,ts:Date.now()}); this._lset('cls_scores', L.slice(-3000));
  },
  async scoreTop(game,higherBetter,limit=10){
    let rows;
    if(this.online){ const q=await this.sb.from('cls_scores').select('nick,name,score').eq('game',game).order('score',{ascending:!higherBetter}).limit(300); rows=q.data||[]; }
    else rows=this._lget('cls_scores', []).filter(r=>r.game===game);
    const m=new Map();
    for(const r of rows){ const c=m.get(r.nick); if(!c || (higherBetter?r.score>c.score:r.score<c.score)) m.set(r.nick,{nick:r.nick,name:r.name,score:r.score}); }
    return [...m.values()].sort((a,b)=>higherBetter?b.score-a.score:a.score-b.score).slice(0,limit);
  },
  // 폴링 구독
  poll(fn, ms){ fn(); const iv=setInterval(fn, ms); const stop=()=>clearInterval(iv);
    if(this.bc){ const h=()=>fn(); this.bc.addEventListener('message',h); return ()=>{ stop(); this.bc.removeEventListener('message',h); }; }
    return stop;
  }
};

/* ---------- 앱(라우터) ---------- */
const App = {
  nick:'', name:'',
  async boot(){
    await Net.init();
    this.nick=localStorage.getItem('cls_nick')||''; this.name=localStorage.getItem('cls_name')||'';
    $('#startBtn').onclick=()=>this.login();
    $('#nickInput').value=this.nick; $('#nameInput').value=this.name;
    [$('#nickInput'),$('#nameInput')].forEach(i=>i.addEventListener('keydown',e=>{ if(e.key==='Enter')this.login(); }));
    $('#logoutBtn').onclick=()=>{ localStorage.removeItem('cls_nick'); localStorage.removeItem('cls_name'); location.reload(); };
    $$('[data-go]').forEach(b=>b.onclick=()=>this.go(b.dataset.go));
    $$('[data-back]').forEach(b=>b.onclick=()=>this.go('plaza'));
    Board.bind(); Battle.bind(); Solo.bind();
    if(this.nick){ this.enterPlaza(); } else $('#nickInput').focus();
  },
  rosterStop:null,
  login(){
    const nk=$('#nickInput').value.trim().replace(/\s+/g,' ');
    const nm=$('#nameInput').value.trim().replace(/\s+/g,' ');
    if(!nk){ toast('닉네임을 넣어 주세요'); return; }
    this.nick=nk.slice(0,10); this.name=(nm||nk).slice(0,10);
    localStorage.setItem('cls_nick',this.nick); localStorage.setItem('cls_name',this.name);
    this.enterPlaza();
  },
  async enterPlaza(){
    $('#auth').classList.add('hidden');
    $('#meNick').textContent=this.nick; $('#meName').textContent=this.name;
    $('#bNick').textContent=this.nick;
    $('#syncTag').innerHTML = Net.online ? '서버 연결됨 · 친구들과 실시간 공유 <span class="on">●</span>' : '이 기기에서만 동작 중 <span class="off">●</span> (서버 연결하면 친구들과 공유)';
    Net.studentUpsert(this.nick,this.name);
    this.go('plaza');
  },
  go(view){
    ['plaza','board','quiz','solo'].forEach(v=>$('#'+v).classList.toggle('hidden', v!==view));
    window.scrollTo(0,0);
    Board[view==='board'?'open':'close']();
    Battle[view==='quiz'?'open':'close']();
    if(view!=='quiz' && typeof Draw!=='undefined') Draw.close();
    Solo[view==='solo'?'open':'close']();
    if(view==='plaza'){ this.rosterStop=Net.poll(()=>this.renderRoster(),Net.online?4000:800); }
    else if(this.rosterStop){ this.rosterStop(); this.rosterStop=null; }
  },
  async renderRoster(){
    const list=await Net.studentList();
    $('#rosterCount').textContent=list.length+'명';
    $('#rosterList').innerHTML = list.length? list.map(s=>`<span class="student ${s.nick===this.nick?'me':''}">${esc(s.nick)}<span class="nm">${esc(s.name||'')}</span></span>`).join('') : '<span class="hint">아직 아무도 없어요. 친구를 초대해요!</span>';
  }
};

/* ======================================================================
   게시판: 꾸미기(벽) · 투표 · D-day  — 모두 실시간 폴링
   ====================================================================== */
const Board = {
  items:[], stop:null, tab:'wall', dragging:null,
  bind(){
    $$('[data-btab]').forEach(b=>b.onclick=()=>this.setTab(b.dataset.btab));
    $$('[data-wall]').forEach(b=>b.onclick=()=>this.addWall(b.dataset.wall));
    $('#newPollBtn').onclick=()=>this.newPoll();
    $('#newDdayBtn').onclick=()=>this.newDday();
    this.wallDrag();
  },
  open(){
    $('#boardSync').innerHTML = Net.online?'실시간 공유 중 <span class="on">●</span>':'이 기기에서만 <span class="off">●</span>';
    this.stop = Net.poll(()=>this.refresh(), Net.online?1500:400);
  },
  close(){ if(this.stop){ this.stop(); this.stop=null; } },
  setTab(t){ this.tab=t; $$('[data-btab]').forEach(b=>b.classList.toggle('on',b.dataset.btab===t));
    ['wall','poll','dday'].forEach(x=>$('#b_'+x).hidden = x!==t); this.render(); },
  async refresh(){ this.items=await Net.boardList(); this.render(); },
  render(){ if(this.tab==='wall')this.renderWall(); else if(this.tab==='poll')this.renderPolls(); else this.renderDday(); },

  /* ---- 꾸미기 벽 ---- */
  renderWall(){
    const wall=$('#wall'); const keep=this.dragging&&this.dragging.id;
    wall.querySelectorAll('.wall-item').forEach(n=>{ if(n.dataset.id!==keep) n.remove(); });
    this.items.filter(i=>i.kind==='note'||i.kind==='sticker').forEach(it=>{
      if(it.id===keep) return;
      let n=wall.querySelector(`.wall-item[data-id="${CSS.escape(String(it.id))}"]`);
      if(!n){ n=el('div','wall-item '+it.kind); n.dataset.id=it.id; wall.appendChild(n);
        n.addEventListener('pointerdown',e=>this.grab(e,it,n));
        let lastTap=0; n.addEventListener('pointerup',()=>{ const now=Date.now(); if(now-lastTap<350) this.delItem(it); lastTap=now; }); }
      if(it.kind==='sticker'){ n.textContent=it.data.emoji; }
      else { n.style.setProperty('--note',it.data.color||'#ffe27a'); n.style.setProperty('--rot',(it.data.rot||-2)+'deg');
        n.innerHTML=esc(it.data.text)+`<span class="by">— ${esc(it.nick||'')}</span>`; }
      const W=wall.clientWidth,H=wall.clientHeight;
      n.style.left=(it.data.x*W)+'px'; n.style.top=(it.data.y*H)+'px';
    });
  },
  async addWall(kind){
    if(kind==='note'){
      const r=await Modal.note(); if(!r)return;
      await Net.boardAdd('note',{text:r.text.slice(0,80),x:rand(.08,.55),y:rand(.08,.64),color:r.color,rot:ri(-6,6)},this.nick(),App.name);
    } else {
      const emoji=await Modal.sticker(); if(!emoji)return;
      await Net.boardAdd('sticker',{emoji,x:rand(.1,.75),y:rand(.1,.75)},this.nick(),App.name);
    }
    this.refresh();
  },
  nick(){ return App.nick; },
  grab(e,it,n){ e.preventDefault(); n.setPointerCapture&&n.setPointerCapture(e.pointerId); n.style.cursor='grabbing';
    const wall=$('#wall'),W=wall.clientWidth,H=wall.clientHeight,r=n.getBoundingClientRect();
    this.dragging={id:it.id, dx:e.clientX-r.left, dy:e.clientY-r.top, it, n, moved:false};
  },
  wallDrag(){
    const move=e=>{ const d=this.dragging; if(!d)return; d.moved=true; const wall=$('#wall'),W=wall.clientWidth,H=wall.clientHeight,wr=wall.getBoundingClientRect();
      let x=(e.clientX-wr.left-d.dx)/W, y=(e.clientY-wr.top-d.dy)/H; x=Math.max(0,Math.min(.92,x)); y=Math.max(0,Math.min(.92,y));
      d.it.data.x=x; d.it.data.y=y; d.n.style.left=(x*W)+'px'; d.n.style.top=(y*H)+'px'; };
    const up=async e=>{ const d=this.dragging; if(!d)return; this.dragging=null; d.n.style.cursor='grab';
      if(d.moved){ await Net.boardUpdate(d.it.id,d.it.data); this.refresh(); } };
    window.addEventListener('pointermove',move); window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up);
  },
  async delItem(it){ if(it.nick && it.nick!==App.nick){ toast('내가 붙인 것만 지울 수 있어요'); return; }
    if(!confirm('지울까요?'))return; await Net.boardDel(it.id); this.refresh(); },

  /* ---- 투표 ---- */
  renderPolls(){
    const box=$('#pollList'); const polls=this.items.filter(i=>i.kind==='poll');
    const votes=this.items.filter(i=>i.kind==='vote');
    if(!polls.length){ box.innerHTML='<div class="empty">아직 투표가 없어요.<br>위 버튼으로 첫 투표를 만들어 보세요!</div>'; return; }
    box.innerHTML='';
    polls.slice().reverse().forEach(p=>{
      const myVote=votes.find(v=>v.data.poll===p.id && v.nick===App.nick);
      const counts=p.data.options.map((_,i)=>votes.filter(v=>v.data.poll===p.id && v.data.choice===i).length);
      const total=counts.reduce((a,b)=>a+b,0);
      const c=el('div','card poll');
      c.innerHTML=`<div class="q">${esc(p.data.q)}</div>`+
        p.data.options.map((o,i)=>`<div class="opt ${myVote&&myVote.data.choice===i?'mine':''}"><div class="fill" style="width:${total?counts[i]/total*100:0}%"></div><button class="pick" data-i="${i}">${esc(o)}</button><span class="cnt">${counts[i]}</span></div>`).join('')+
        `<div class="meta"><span>${total}명 참여 · ${esc(p.nick||'')} 만듦</span>${p.nick===App.nick?'<button data-del style="color:var(--red)">삭제</button>':''}</div>`;
      c.querySelectorAll('.pick').forEach(b=>b.onclick=()=>this.vote(p,+b.dataset.i,myVote));
      const del=c.querySelector('[data-del]'); if(del)del.onclick=async()=>{ if(confirm('투표를 지울까요?')){ await Net.boardDel(p.id); for(const v of votes.filter(v=>v.data.poll===p.id)) await Net.boardDel(v.id); this.refresh(); } };
      box.appendChild(c);
    });
  },
  async vote(p,i,myVote){
    if(myVote){ if(myVote.data.choice===i)return; myVote.data.choice=i; await Net.boardUpdate(myVote.id,myVote.data); }
    else await Net.boardAdd('vote',{poll:p.id,choice:i},App.nick,App.name);
    this.refresh();
  },
  async newPoll(){
    const r=await Modal.poll(); if(!r)return;
    await Net.boardAdd('poll',{q:r.q,options:r.options},App.nick,App.name); this.setTab('poll'); this.refresh();
  },

  /* ---- D-day ---- */
  renderDday(){
    const box=$('#ddayList'); const list=this.items.filter(i=>i.kind==='dday');
    if(!list.length){ box.innerHTML='<div class="empty">아직 D-day가 없어요.<br>소풍·방학·시험 날짜를 추가해 보세요!</div>'; return; }
    const today=new Date(); today.setHours(0,0,0,0);
    box.innerHTML='';
    list.map(it=>{ const d=new Date(it.data.date+'T00:00:00'); const diff=Math.round((d-today)/864e5); return {it,diff,d}; })
      .sort((a,b)=>Math.abs(a.diff)-Math.abs(b.diff)).forEach(({it,diff,d})=>{
      const label = diff===0?'D-DAY':(diff>0?'D-'+diff:'D+'+(-diff));
      const c=el('div','card dday');
      c.innerHTML=`<div class="num ${diff<0?'past':''}">${label}</div><div class="info"><b>${esc(it.data.title)}</b><div class="date">${it.data.date} · ${esc(it.nick||'')}</div></div>${it.nick===App.nick?'<button class="ghost-x" data-del>✕</button>':''}`;
      const del=c.querySelector('[data-del]'); if(del)del.onclick=async()=>{ if(confirm('지울까요?')){ await Net.boardDel(it.id); this.refresh(); } };
      box.appendChild(c);
    });
  },
  async newDday(){
    const r=await Modal.dday(); if(!r)return;
    await Net.boardAdd('dday',{title:r.title,date:r.date},App.nick,App.name); this.setTab('dday'); this.refresh();
  }
};

    if(this.isHost){
      const evs=await Net.pull(this.code,this.cursor);
      for(const e of evs){ this.cursor=Math.max(this.cursor,e.id); const d=e.data;
        if(d.kind==='join'){ this.knownPlayers[d.nick]=d.name; }
        else if(d.kind==='score'){ (this.roundScores[d.round]=this.roundScores[d.round]||{})[d.nick]=d.score; } }
      if(room.phase==='lobby') this.renderHostLobby(room);
      if(room.phase==='play') this.renderHostWaiting(room);
    } else {
      // 참가자: 상태 반영
      if(room.phase==='lobby') this.waiting('대장이 시작하길 기다려요 ⏳ ('+Object.keys(room.board||[]).length+')');
    }
    // 공통: 라운드 시작되면 1번만 플레이
    if(room.phase==='play' && room.round>this.playedRound){ this.playedRound=room.round; this.playRound(room); }
    if(room.phase==='reveal' && room.round>this.revealedRound){ this.revealedRound=room.round; this.showReveal(room); }
    if(room.phase==='end' && !this.endedShown){ this.endedShown=true; this.showEnd(room); }
  },

  hostLobby(){ this.renderHostLobby(null); },
  renderHostLobby(room){
    const players=Object.entries(this.knownPlayers);
    const sig='lobby:'+players.map(p=>p[0]).join(',');
    if(this._sig===sig && $('#bq_start'))return; this._sig=sig;
    this.wrap('🎮 대기방', `
      <div class="sc-body" style="position:static;padding:8px 0">
        <p class="muted">친구들에게 이 코드를 알려주세요</p>
        <div class="code-box">${this.code}</div>
        <p class="muted">게임 ${this.games.length}라운드 · ${this.games.map(g=>BGAMES[g].emoji).join(' ')}</p>
        <div class="player-chips" id="bq_players">${players.map(([nk,nm])=>`<span class="pchip">${esc(nk)}</span>`).join('')||'<span class="muted">아직 아무도 없어요…</span>'}</div>
        <button class="btn" id="bq_start" style="max-width:320px">시작하기 (${players.length}명)</button>
      </div>`);
    $('#bq_start').onclick=()=>this.startRound(0);
  },
  async startRound(r){ await Net.roomSet(this.code,{phase:'play',host:App.nick,games:this.games,round:r,board:this.boardSoFar()}); },
  boardSoFar(){ return this._lastBoard||[]; },

  async playRound(room){
    const g=BGAMES[room.games[room.round]]; if(!g){return;}
    this.playing=true;
    // 카운트다운 → 15초 플레이
    this.wrap(`⚔️ ${room.round+1}라운드 / ${room.games.length}`, `<div class="sc-body" style="position:static"><div class="big-title">${g.emoji} ${g.name}</div><div class="countdown" id="bq_cd">3</div><p class="hint">${g.desc}</p></div>`);
    for(let c=3;c>=1;c--){ const cd=$('#bq_cd'); if(cd)cd.textContent=c; await sleep(700); }
    const stage=el('div','stage'); const timer=el('div'); timer.style.cssText='height:10px;background:#0d1430;border-radius:999px;overflow:hidden;max-width:440px;margin:0 auto 12px'; const ti=el('div'); ti.style.cssText='height:100%;width:100%;background:linear-gradient(90deg,var(--cyan),var(--purple));transition:width .2s'; timer.appendChild(ti);
    this.wrap(`⚔️ ${room.round+1}라운드`, `<div class="sc-body" id="bq_play" style="position:static"></div>`);
    $('#bq_play').append(timer,stage);
    const getScore=g.run(stage);
    let left=ROUND_SEC*1000; const t0=Date.now();
    await new Promise(res=>{ const iv=setInterval(()=>{ const el2=Date.now()-t0; ti.style.width=Math.max(0,100-el2/(ROUND_SEC*1000)*100)+'%'; if(el2>=ROUND_SEC*1000){ clearInterval(iv); res(); } },100); });
    if(stage._stop)stage._stop();
    const score=getScore()|0;
    const pl=$('#bq_play'); if(pl)pl.id='bq_over';   // 플레이 끝 → 대기/집계 화면이 덮을 수 있게
    this.playing=false; this._sig='';
    await Net.emit(this.code,{kind:'score',round:room.round,nick:App.nick,score});
    if(this.isHost){ this.roundScores[room.round]=this.roundScores[room.round]||{}; this.roundScores[room.round][App.nick]=score; this.renderHostWaiting(room); }
    else this.waiting(`내 점수 ${score}점! 다른 친구들을 기다려요…`);
  },
  renderHostWaiting(room){
    if(this.playing||$('#bq_play'))return; // 아직 플레이/카운트다운 중
    const sc=this.roundScores[room.round]||{}; const done=Object.keys(sc).length, total=Object.keys(this.knownPlayers).length;
    const sig='wait:'+room.round+':'+done+'/'+total+':'+Object.keys(sc).join(',');
    if(this._sig===sig && $('#bq_reveal'))return; this._sig=sig;
    const body=`<div class="sc-body" style="position:static"><div class="big-title">${done} / ${total} 완료</div><p class="muted">모두 끝나면 결과를 공개해요</p>
      <div class="player-chips">${Object.keys(this.knownPlayers).map(nk=>`<span class="pchip" style="${sc[nk]!=null?'border-color:var(--green);color:var(--green)':''}">${esc(nk)} ${sc[nk]!=null?'✓':'…'}</span>`).join('')}</div>
      <button class="btn" id="bq_reveal" style="max-width:320px">결과 공개 →</button></div>`;
    this.wrap(`⚔️ ${room.round+1}라운드 집계`, body);
    $('#bq_reveal').onclick=()=>this.reveal(room);
  },
  async reveal(room){
    const sc=this.roundScores[room.round]||{}; const g=BGAMES[room.games[room.round]];
    // 이번 라운드 등수 → 점수
    const ranked=Object.entries(this.knownPlayers).map(([nk,nm])=>({nk,nm,s:sc[nk]??-1})).sort((a,b)=>b.s-a.s);
    const pts=[100,85,75,68,62,57,53,50,47,45];
    const prev=Object.fromEntries((room.board||[]).map(b=>[b.nick,{total:b.total||0,rounds:b.rounds||0}]));
    ranked.forEach((r,i)=>{ r.round=r.s<0?0:(pts[i]??40); const pv=prev[r.nk]||{total:0,rounds:0}; r.total=pv.total+r.round; r.rounds=pv.rounds+1; r.avg=Math.round(r.total/r.rounds); });
    const board=ranked.map(r=>({nick:r.nk,name:this.knownPlayers[r.nk],roundScore:r.s<0?'-':r.s,round:r.round,total:r.total,rounds:r.rounds,avg:r.avg})).sort((a,b)=>b.avg-a.avg||b.total-a.total);
    this._lastBoard=board;
    await Net.roomSet(this.code,{phase:'reveal',host:App.nick,games:this.games,round:room.round,board,gameName:g.name});
  },
  showReveal(room){
    const board=room.board||[]; const last=room.round+1>=room.games.length;
    this.wrap(`🏆 ${room.round+1}라운드 결과`, `<div class="sc-body" style="position:static">
      <p class="muted">${esc(room.gameName||'')} · 평균 점수로 순위 (등수대로 점수 획득)</p>
      <div class="rank-list">${board.map((b,i)=>`<div class="rank-row ${b.nick===App.nick?'me':''}"><span class="rk">${i<3?['🥇','🥈','🥉'][i]:i+1}</span><span class="nm">${esc(b.nick)} <small>${esc(b.name||'')} · 이번 ${b.roundScore} (+${b.round}) · 합계 ${b.total}</small></span><span class="pt">${b.avg}</span></div>`).join('')}</div>
      ${this.isHost?`<button class="btn" id="bq_next" style="max-width:320px;margin-top:10px">${last?'🏁 최종 결과':'다음 라운드 →'}</button>`:`<p class="hint" style="margin-top:14px">대장이 ${last?'최종 결과를':'다음 라운드를'} 열어요…</p>`}</div>`);
    if(this.isHost){ $('#bq_next').onclick=async()=>{ if(last) await Net.roomSet(this.code,{phase:'end',host:App.nick,games:this.games,round:room.round,board}); else { this.roundScores[room.round+1]={}; await Net.roomSet(this.code,{phase:'play',host:App.nick,games:this.games,round:room.round+1,board}); } }; }
  },
  showEnd(room){
    const board=room.board||[]; const win=board[0];
    this.wrap('🏁 최종 결과', `<div class="sc-body" style="position:static">
      <div style="font-size:60px">🏆</div><div class="big-title">${win?esc(win.nick):''} 우승!</div><p class="muted">${win?esc(win.name||''):''}</p>
      <div class="rank-list" style="margin-top:14px">${board.map((b,i)=>`<div class="rank-row ${b.nick===App.nick?'me':''}"><span class="rk">${i<3?['🥇','🥈','🥉'][i]:i+1}</span><span class="nm">${esc(b.nick)} <small>${esc(b.name||'')} · 합계 ${b.total}</small></span><span class="pt">${b.avg}<small style="display:block;font-size:10px;color:var(--muted);font-weight:600">평균</small></span></div>`).join('')}</div>
      <button class="btn" id="bq_home" style="max-width:320px;margin-top:16px">광장으로</button></div>`);
    $('#bq_home').onclick=()=>App.go('plaza');
  },
  waiting(msg){ if($('#bq_play'))return; const sig='wait-msg:'+msg; if(this._sig===sig)return; this._sig=sig; this.wrap('⚔️ 퀴즈 배틀', `<div class="sc-body" style="position:static"><div style="font-size:50px">⏳</div><p class="muted" style="max-width:320px">${esc(msg)}</p></div>`); }
};

const BADGES = [
  {id:'first', emoji:'🎯', name:'첫 승부', desc:'아무 게임이나 한 판 완료'},
  {id:'all10', emoji:'🎮', name:'올라운더', desc:'10가지 게임 모두 플레이'},
  {id:'top1',  emoji:'🏆', name:'정상 정복', desc:'어떤 게임이든 순위 1위'},
  {id:'rich',  emoji:'💰', name:'코인 부자', desc:'코인 500개 모으기'},
  {id:'streak',emoji:'🔥', name:'3일 연속', desc:'3일 연속 접속'},
  {id:'bolt',  emoji:'⚡', name:'번개손', desc:'반응속도 250ms 이하'},
  {id:'clicker',emoji:'💥',name:'광클러', desc:'클릭 러시 70회 이상'},
  {id:'snakeK',emoji:'🐍', name:'대왕뱀', desc:'스네이크 15점 이상'},
  {id:'typer', emoji:'⌨️', name:'타자왕', desc:'타이핑 60 WPM 이상'},
  {id:'lv5',   emoji:'⭐', name:'레벨 5', desc:'레벨 5 달성'},
];
const TITLES=[[1,'초보'],[3,'루키'],[6,'플레이어'],[10,'고수'],[15,'마스터'],[22,'챔피언'],[30,'전설']];
const Rewards = {
  coins:0, xp:0, badges:new Set(), played:new Set(), streak:0,
  level(){ return Math.floor(Math.sqrt(this.xp/50))+1; },
  title(){ const l=this.level(); let t='초보'; for(const[m,n]of TITLES) if(l>=m)t=n; return t; },
  xpFloor(l){ return 50*(l-1)*(l-1); },
  progress(){ const l=this.level(), a=this.xpFloor(l), b=this.xpFloor(l+1); return {l, cur:this.xp-a, need:b-a, pct:Math.min(100,Math.round((this.xp-a)/(b-a)*100))}; },
  load(){
    const d=JSON.parse(localStorage.getItem('cls_rewards')||'{}');
    this.coins=d.coins||0; this.xp=d.xp||0; this.badges=new Set(d.badges||[]); this.played=new Set(d.played||[]);
    // 접속 연속일
    const today=new Date().toDateString(), last=d.lastDay;
    if(last!==today){ const y=new Date(Date.now()-864e5).toDateString(); this.streak=(last===y)?(d.streak||1)+1:1; } else this.streak=d.streak||1;
    d.lastDay=today; this.save();
  },
  save(){ localStorage.setItem('cls_rewards', JSON.stringify({coins:this.coins,xp:this.xp,badges:[...this.badges],played:[...this.played],streak:this.streak,lastDay:new Date().toDateString()})); },
  async sync(){ /* 혼자 연습 기록은 기기에 저장 */ },
  // 게임 끝 → 보상 계산. 반환: {coins, xp, levelUp, newBadges[]}
  grant(game, score, isRecord, rank){
    const before=this.level();
    const scoreBonus = Math.min(40, Math.round(score/ (game.higherBetter? (game.id==='flap'?1:3) : 1) ));
    let coins = 10 + (game.higherBetter? Math.min(30,Math.max(0,Math.round(score/2))) : 15) + (isRecord?30:0) + (rank===0?25:0);
    let xp = 15 + (isRecord?20:0) + (rank>=0&&rank<3?10:0);
    this.coins+=coins; this.xp+=xp; this.played.add(game.id);
    const got=[];
    const give=id=>{ if(!this.badges.has(id)){ this.badges.add(id); got.push(BADGES.find(b=>b.id===id)); } };
    give('first');
    if(this.played.size>=10) give('all10');
    if(rank===0) give('top1');
    if(this.coins>=500) give('rich');
    if(this.streak>=3) give('streak');
    if(this.level()>=5) give('lv5');
    if(game.id==='reaction'&&score<=250) give('bolt');
    if(game.id==='click'&&score>=70) give('clicker');
    if(game.id==='snake'&&score>=15) give('snakeK');
    if(game.id==='typing'&&score>=60) give('typer');
    this.save(); this.sync();
    return {coins, xp, levelUp:this.level()>before, newBadges:got};
  }
};

    let AC=null; const beep=f=>{ try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),gg=AC.createGain();o.frequency.value=f;gg.gain.value=.05;o.connect(gg);gg.connect(AC.destination);o.start();o.stop(AC.currentTime+.18);}catch(e){} };
    setTimeout(next,600); return ()=>{};
  }
});

/* ======================================================================
   캐치마인드(그림 맞히기) — 방 코드로 모여 한 명이 그리고 나머지가 맞혀요.
   모두 Net 폴링으로 동기화 (배틀과 같은 방식). 2대 이상에서 테스트 필요.
   ====================================================================== */
const DRAW_WORDS=['사과','강아지','학교','축구공','무지개','피자','로봇','공룡','아이스크림','자동차','비행기','꽃','태양','우산','연필','토끼','바나나','케이크','기차','산타','유령','거북이','나비','눈사람','햄버거','문어','왕관','선생님','컴퓨터','고양이','물고기','하트','별똥별','수박','핫도그','농구공','안경','케첩','해바라기','펭귄'];
const Draw = {
  code:'', isHost:false, loopStop:null, cursor:0, players:{}, order:[], round:-1,
  myWord:'', lastRound:-2, feed:[], drawing:false, lastPt:null, buf:[], flushT:0, color:'#2b2250', solvedShown:false, endedShown:false,
  home(){
    Battle.close();
    Battle.wrap('🎨 그림 맞히기', `
      <div class="plaza-hero" style="padding:8px 0 18px"><div class="logo-big" style="width:60px;height:60px;font-size:32px;background:linear-gradient(135deg,#36c6ff,#5a7bff)">🎨</div><h1 style="font-size:22px">그려서 맞혀요!</h1><p>한 명이 그리면 나머지가 정답을 맞혀요</p></div>
      <button class="btn blue" id="dw_create" style="margin-bottom:12px">🖍️ 방 만들기 (대장)</button>
      <button class="btn ghost" id="dw_join">🚪 코드로 참가하기</button>`);
    $('#dw_create').onclick=()=>this.create();
    $('#dw_join').onclick=()=>this.joinPrompt();
  },
  reset(){ this.code='';this.isHost=false;this.cursor=0;this.players={};this.order=[];this.round=-1;this.myWord='';this.lastRound=-2;this.feed=[];this.solvedShown=false;this.endedShown=false; if(this.loopStop){this.loopStop();this.loopStop=null;} },
  async create(){ this.reset(); this.isHost=true; this.code=code4();
    await Net.roomSet(this.code,{mode:'draw',phase:'lobby',host:App.nick,players:{},round:-1});
    await Net.emit(this.code,{kind:'join',nick:App.nick,name:App.name});
    this.startLoop(); this.lobby(); },
  joinPrompt(){
    Battle.wrap('🚪 참가하기', `<div class="card"><div class="field"><label>방 코드 4자리</label><input id="dw_code" maxlength="4" placeholder="ABCD" style="text-transform:uppercase;font-size:24px;letter-spacing:4px;text-align:center"></div><button class="btn" id="dw_enter">입장</button></div>`);
    $('#dw_code').focus();
    $('#dw_enter').onclick=async()=>{ const c=$('#dw_code').value.trim().toUpperCase(); if(c.length!==4){toast('코드 4자리를 넣어요');return;}
      const room=await Net.roomGet(c); if(!room||room.mode!=='draw'){toast('그림 맞히기 방이 아니에요');return;}
      this.reset(); this.code=c; await Net.emit(c,{kind:'join',nick:App.nick,name:App.name}); this.startLoop(); this.waiting('방에 들어왔어요! 대장이 시작하길 기다려요 🎨'); };
  },
  startLoop(){ if(this.loopStop)this.loopStop(); this.loopStop=Net.poll(()=>this.tick(),Net.online?700:250); },
  close(){ if(this.loopStop){this.loopStop();this.loopStop=null;} },

  async tick(){
    const room=await Net.roomGet(this.code); if(!room)return;
    const evs=await Net.pull(this.code,this.cursor);
    for(const e of evs){ this.cursor=Math.max(this.cursor,e.id); const d=e.data;
      if(d.kind==='join'){ this.players[d.nick]=d.name; }
      else if(d.kind==='word'){ if(d.to===App.nick) this.myWord=d.word; }
      else if(d.kind==='stroke'){ if(d.round===room.round && this._ctx) this.drawSeg(d); }
      else if(d.kind==='clear'){ if(this._ctx) this.clearCanvas(); }
      else if(d.kind==='guess'){ this.feed.push(d); if(this.feed.length>30)this.feed.shift();
        if(this.isHost && room.phase==='draw' && !room.solver) this.checkGuess(room,d); this.renderFeed(); } }
    if(room.phase==='lobby'){ if(this.isHost)this.lobby(); else this.waiting('대장이 시작하길 기다려요 🎨 ('+Object.keys(this.players).length+'명)'); }
    if(room.phase==='draw' && room.round!==this.lastRound){ this.lastRound=room.round; this.round=room.round; this.myWord=''; this.feed=[]; this.solvedShown=false; this.enterRound(room); }
    if(room.phase==='reveal' && !this.solvedShown){ this.solvedShown=true; this.showReveal(room); }
    if(room.phase==='end' && !this.endedShown){ this.endedShown=true; this.showEnd(room); }
  },

  lobby(){
    const players=Object.entries(this.players);
    const sig='dlobby:'+players.map(p=>p[0]).join(',');
    if(this._sig===sig && $('#dw_start'))return; this._sig=sig;
    Battle.wrap('🎨 대기방', `<div class="sc-body" style="position:static;padding:8px 0">
      <p class="muted">친구들에게 코드를 알려주세요</p><div class="code-box">${this.code}</div>
      <p class="muted">한 명씩 돌아가며 그려요 (${players.length}라운드)</p>
      <div class="player-chips">${players.map(([nk])=>`<span class="pchip">${esc(nk)}</span>`).join('')||'<span class="muted">아직 아무도 없어요…</span>'}</div>
      <button class="btn blue" id="dw_start" style="max-width:320px">시작하기 (${players.length}명)</button></div>`);
    $('#dw_start').onclick=()=>{ if(players.length<2){ toast('2명 이상 있어야 해요'); return; } this.startRound(0); };
  },
  async startRound(r){
    this.order=Object.keys(this.players);
    const drawer=this.order[r%this.order.length];
    const word=DRAW_WORDS[ri(0,DRAW_WORDS.length-1)];
    const prev=(await Net.roomGet(this.code))||{};
    await Net.emit(this.code,{kind:'clear'});
    await Net.emit(this.code,{kind:'word',to:drawer,word});
    await Net.roomSet(this.code,{mode:'draw',phase:'draw',host:App.nick,players:this.players,order:this.order,round:r,drawer,wordLen:word.length,startAt:Date.now(),dur:70,solver:null,word,scores:prev.scores||{},rounds:(prev.rounds||0)+1});
  },
  norm(t){ return String(t||'').replace(/\s+/g,'').toLowerCase(); },
  async checkGuess(room,d){
    if(this.norm(d.text)===this.norm(room.word) && d.nick!==room.drawer){
      const elapsed=(Date.now()-room.startAt)/1000; const pt=Math.max(20,Math.round(100-elapsed*1.5));
      const sc={...(room.scores||{})}; sc[d.nick]=(sc[d.nick]||0)+pt; sc[room.drawer]=(sc[room.drawer]||0)+30;
      await Net.roomSet(this.code,{...room,phase:'reveal',solver:d.nick,solverPt:pt,scores:sc});
    }
  },

  enterRound(room){
    const amDrawer=room.drawer===App.nick;
    Battle.wrap(`🎨 ${room.round+1}/${(room.order||[]).length}라운드`, `<div class="sc-body" id="dw_body" style="position:static;gap:8px">
      <div class="statbar"><div>그리는 사람 <b>${esc(room.drawer)}</b></div><div id="dw_timer">⏱ ${room.dur}</div></div>
      <div id="dw_word" class="big-title" style="font-size:22px">${amDrawer?('제시어: '+esc(room.word)):('○ '.repeat(room.wordLen).trim())}</div>
      <canvas id="dw_canvas" width="320" height="300" class="game" style="background:#fff;width:100%;max-width:360px"></canvas>
      ${amDrawer?`<div class="color-pick" id="dw_colors"></div><button class="ghost-x" id="dw_clear">전체 지우기</button>`:
        `<div class="row" style="width:100%;max-width:360px"><input id="dw_guess" placeholder="정답을 입력하고 전송!" maxlength="20"><button class="btn sm blue" id="dw_send" style="margin:0">전송</button></div>`}
      <div id="dw_feed" style="width:100%;max-width:360px;text-align:left;font-size:13px;max-height:120px;overflow:auto"></div>
      ${this.isHost?'<button class="ghost-x" id="dw_skip">정답 공개 / 넘기기</button>':''}</div>`);
    const cv=$('#dw_canvas'); this._cv=cv; this._ctx=cv.getContext('2d'); this.clearCanvas();
    if(amDrawer) this.setupDrawer(cv,room); else this.setupGuesser(room);
    if(this.isHost){ $('#dw_skip').onclick=async()=>{ const r=await Net.roomGet(this.code); await Net.roomSet(this.code,{...r,phase:'reveal',solver:null}); }; }
    this.renderFeed();
    // 타이머
    if(this._tmr)clearInterval(this._tmr);
    this._tmr=setInterval(async()=>{ const t=$('#dw_timer'); if(!t){clearInterval(this._tmr);return;} const left=Math.max(0,Math.round(room.dur-(Date.now()-room.startAt)/1000)); t.textContent='⏱ '+left;
      if(left<=0){ clearInterval(this._tmr); if(this.isHost){ const r=await Net.roomGet(this.code); if(r.phase==='draw') await Net.roomSet(this.code,{...r,phase:'reveal',solver:null}); } } },500);
  },
  clearCanvas(){ if(!this._ctx)return; this._ctx.fillStyle='#fff'; this._ctx.fillRect(0,0,this._cv.width,this._cv.height); this._ctx.lineCap='round'; this._ctx.lineJoin='round'; },
  drawSeg(d){ const c=this._ctx,cv=this._cv; c.strokeStyle=d.color; c.lineWidth=d.w; c.beginPath(); d.pts.forEach((p,i)=>{ const x=p[0]*cv.width,y=p[1]*cv.height; i?c.lineTo(x,y):c.moveTo(x,y); }); c.stroke(); },
  setupDrawer(cv,room){
    const colors=['#2b2250','#ff5a6a','#ff9f1c','#ffd23e','#3ec46d','#4ea8ff','#9b6bff','#ffffff'];
    $('#dw_colors').innerHTML=colors.map(c=>`<button data-c="${c}" style="background:${c};border-color:${c==='#ffffff'?'#ccc':'#fff'}"></button>`).join('');
    $$('#dw_colors button').forEach(b=>b.onclick=()=>{ this.color=b.dataset.c; });
    $('#dw_clear').onclick=async()=>{ this.clearCanvas(); await Net.emit(this.code,{kind:'clear'}); };
    const pt=e=>{ const r=cv.getBoundingClientRect(); return [ (e.clientX-r.left)/r.width, (e.clientY-r.top)/r.height ]; };
    const down=e=>{ e.preventDefault(); this.drawing=true; this.buf=[pt(e)]; this.lastPt=this.buf[0]; };
    const move=e=>{ if(!this.drawing)return; const p=pt(e); this.drawSeg({pts:[this.lastPt,p],color:this.color,w:this.color==='#ffffff'?16:4}); this.lastPt=p; this.buf.push(p);
      if(!this.flushT) this.flushT=setTimeout(()=>this.flush(room),110); };
    const up=()=>{ if(this.drawing){ this.drawing=false; this.flush(room); } };
    cv.addEventListener('pointerdown',down); cv.addEventListener('pointermove',move); window.addEventListener('pointerup',up);
    this._drawoff=()=>{ cv.removeEventListener('pointerdown',down); cv.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); };
  },
  async flush(room){ clearTimeout(this.flushT); this.flushT=0; if(this.buf.length<2)return; const pts=this.buf; this.buf=[pts[pts.length-1]];
    await Net.emit(this.code,{kind:'stroke',round:room.round,pts,color:this.color,w:this.color==='#ffffff'?16:4}); },
  setupGuesser(room){
    const send=async()=>{ const v=$('#dw_guess').value.trim(); if(!v)return; $('#dw_guess').value='';
      await Net.emit(this.code,{kind:'guess',nick:App.nick,text:v,round:room.round}); };
    $('#dw_send').onclick=send; $('#dw_guess').addEventListener('keydown',e=>{ if(e.key==='Enter')send(); });
  },
  renderFeed(){ const f=$('#dw_feed'); if(!f)return; f.innerHTML=this.feed.slice(-12).map(g=>`<div><b>${esc(g.nick)}</b> ${esc(g.text)}</div>`).join(''); f.scrollTop=f.scrollHeight; },
  showReveal(room){
    if(this._tmr)clearInterval(this._tmr); if(this._drawoff)this._drawoff();
    const scores=room.scores||{}; const board=Object.keys(this.players).map(nk=>({nick:nk,name:this.players[nk],total:scores[nk]||0,avg:Math.round((scores[nk]||0)/(room.rounds||1))})).sort((a,b)=>b.avg-a.avg);
    const last=room.round+1>=(room.order||[]).length;
    Battle.wrap('🎨 라운드 결과', `<div class="sc-body" style="position:static">
      <div class="big-title" style="color:var(--green)">정답: ${esc(room.word)}</div>
      <p class="muted">${room.solver?`🎉 <b>${esc(room.solver)}</b> 정답! (+${room.solverPt}점, 그린 사람 +30)`:'아무도 못 맞혔어요 😅'}</p>
      <div class="rank-list">${board.map((b,i)=>`<div class="rank-row ${b.nick===App.nick?'me':''}"><span class="rk">${i<3?['🥇','🥈','🥉'][i]:i+1}</span><span class="nm">${esc(b.nick)} <small>${esc(b.name||'')} · 합계 ${b.total}</small></span><span class="pt">${b.avg}</span></div>`).join('')}</div>
      ${this.isHost?`<button class="btn blue" id="dw_next" style="max-width:320px;margin-top:10px">${last?'🏁 최종 결과':'다음 라운드 →'}</button>`:`<p class="hint" style="margin-top:12px">대장이 ${last?'결과를':'다음을'} 열어요…</p>`}</div>`);
    if(this.isHost){ $('#dw_next').onclick=async()=>{ if(last){ const r=await Net.roomGet(this.code); await Net.roomSet(this.code,{...r,phase:'end'}); } else this.startRound(room.round+1); }; }
  },
  showEnd(room){
    const scores=room.scores||{}; const board=Object.keys(this.players).map(nk=>({nick:nk,name:this.players[nk],total:scores[nk]||0,avg:Math.round((scores[nk]||0)/(room.rounds||1))})).sort((a,b)=>b.avg-a.avg);
    const win=board[0];
    Battle.wrap('🏁 최종 결과', `<div class="sc-body" style="position:static"><div style="font-size:60px">🏆</div><div class="big-title">${win?esc(win.nick):''} 우승!</div>
      <div class="rank-list" style="margin-top:14px">${board.map((b,i)=>`<div class="rank-row ${b.nick===App.nick?'me':''}"><span class="rk">${i<3?['🥇','🥈','🥉'][i]:i+1}</span><span class="nm">${esc(b.nick)} <small>${esc(b.name||'')} · 합계 ${b.total}</small></span><span class="pt">${b.avg}<small style="display:block;font-size:10px;color:var(--muted);font-weight:600">평균</small></span></div>`).join('')}</div>
      <button class="btn blue" id="dw_home" style="max-width:320px;margin-top:16px">광장으로</button></div>`);
    $('#dw_home').onclick=()=>{ this.close(); App.go('plaza'); };
  },
  waiting(msg){ const sig='dw-wait:'+msg; if(this._sig===sig)return; this._sig=sig; Battle.wrap('🎨 그림 맞히기', `<div class="sc-body" style="position:static"><div style="font-size:50px">⏳</div><p class="muted" style="max-width:320px">${esc(msg)}</p></div>`); }
};


App.boot();
</script>
