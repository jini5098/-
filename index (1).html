<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1f">
<title>우리반 광장</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  --bg:#0b0f1f; --panel:#141a2e; --panel2:#1b2340; --ink:#eaf0ff; --muted:#8a96bd;
  --line:#28304f; --cyan:#22e0d6; --pink:#ff3d8b; --yellow:#ffd23e; --green:#3ddc84; --purple:#9b6bff; --red:#ff4d5e; --orange:#ff9b2f;
  --r:16px; --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
html,body{margin:0;height:100%}
body{background:radial-gradient(1000px 500px at 50% -10%,#18224a,#0b0f1f 62%) fixed,var(--bg);
  color:var(--ink);font:15px/1.5 "Pretendard Variable","Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  overflow-x:hidden;word-break:keep-all;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
img,canvas{max-width:100%}
.hidden{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding:calc(14px + var(--st)) 16px calc(24px + var(--sb))}

/* 공통 */
.btn{display:block;width:100%;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#06111a;border-radius:14px;padding:15px;font-size:17px;font-weight:800;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.sm{display:inline-block;width:auto;padding:10px 18px;font-size:15px}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line);font-weight:700}
.btn.warn{background:linear-gradient(135deg,#ff3d8b,#ff6f61);color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px}
.chip b{color:var(--cyan)}
.ghost-x{background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 13px;font-size:14px;color:var(--muted)}
.ghost-x:active{color:var(--ink)}
input,textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:13px 15px;font-size:16px;outline:none}
input:focus,textarea:focus{border-color:var(--cyan)}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--sb));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:11px 18px;border-radius:12px;z-index:200;font-size:14px;opacity:0;transition:.25s;max-width:90vw;text-align:center}
.toast.show{opacity:1}

/* 로그인 */
#auth{min-height:100svh;display:grid;place-items:center;padding:24px}
.auth-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:30px 24px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.logo-big{width:76px;height:76px;margin:0 auto 10px;border-radius:22px;background:linear-gradient(135deg,var(--cyan),var(--purple));display:grid;place-items:center;font-size:40px;box-shadow:0 0 30px rgba(34,224,214,.45)}
.auth-card h1{font-size:30px;margin:4px 0 2px;letter-spacing:-.5px}
.auth-card .sub{color:var(--muted);margin-bottom:20px;font-size:14px}
.field{text-align:left;margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin:0 0 5px 4px}
.field .small{font-size:11px;color:var(--muted)}
.auth-card .btn{margin-top:6px}

/* 상단바 */
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.topbar h2{font-size:18px;margin:0;flex:1;font-weight:800}
.me-chip{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.me-nick{font-size:15px;font-weight:800}
.me-name{font-size:11px;color:var(--muted)}

/* 광장 */
.plaza-hero{text-align:center;padding:14px 0 22px}
.plaza-hero .logo-big{width:64px;height:64px;font-size:34px}
.plaza-hero h1{font-size:26px;margin:8px 0 2px}
.plaza-hero p{color:var(--muted);margin:0;font-size:14px}
.dest{display:grid;gap:14px}
.dest-card{position:relative;overflow:hidden;border-radius:22px;padding:24px 22px;text-align:left;border:1px solid var(--line);color:#fff}
.dest-card .emoji{font-size:46px}
.dest-card h3{margin:12px 0 4px;font-size:22px;font-weight:800}
.dest-card p{margin:0;font-size:14px;opacity:.9;line-height:1.5}
.dest-quiz{background:linear-gradient(135deg,#7b3dff,#ff3d8b)}
.dest-board{background:linear-gradient(135deg,#0ea5a0,#2b6fff)}
.dest-card::after{content:"→";position:absolute;top:22px;right:22px;font-size:24px;opacity:.7}

/* 탭 */
.tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:14px}
.tabs button{flex:1;padding:10px;border-radius:10px;font-size:14px;font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--panel2);color:var(--ink)}

/* 카드/리스트 공통 */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:16px}
.muted{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:34px 16px;border:2px dashed var(--line);border-radius:16px}
.row{display:flex;gap:8px;align-items:center}
.sync{font-size:11px;color:var(--muted);text-align:center;margin-top:10px}
.sync .on{color:var(--green)} .sync .off{color:var(--yellow)}

/* 투표 */
.poll .opt{display:flex;align-items:center;gap:10px;margin:7px 0;position:relative;background:#0e1430;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.poll .opt .fill{position:absolute;inset:0;background:linear-gradient(90deg,rgba(34,224,214,.22),rgba(155,107,255,.22));width:0;transition:width .4s}
.poll .opt button.pick{position:relative;flex:1;text-align:left;padding:12px 14px;font-weight:600;font-size:15px}
.poll .opt .cnt{position:relative;padding:0 14px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--cyan)}
.poll .opt.mine{border-color:var(--cyan)}
.poll .q{font-weight:800;font-size:16px;margin-bottom:10px}
.poll .meta{font-size:12px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between}

/* D-day */
.dday{display:flex;align-items:center;gap:14px}
.dday .num{font-size:30px;font-weight:900;min-width:76px;text-align:center;color:var(--yellow);font-variant-numeric:tabular-nums}
.dday .num.past{color:var(--muted)}
.dday .info{flex:1}
.dday .info b{font-size:16px}
.dday .info .date{font-size:12px;color:var(--muted)}

/* 꾸미기 벽 */
#wall{position:relative;width:100%;height:62vh;min-height:420px;background:
  repeating-linear-gradient(0deg,transparent,transparent 23px,rgba(255,255,255,.03) 24px),
  repeating-linear-gradient(90deg,transparent,transparent 23px,rgba(255,255,255,.03) 24px),#0c1226;
  border:1px solid var(--line);border-radius:16px;overflow:hidden;touch-action:none;user-select:none}
.wall-item{position:absolute;max-width:160px;cursor:grab;filter:drop-shadow(0 6px 12px rgba(0,0,0,.4))}
.wall-item.sticker{font-size:40px;line-height:1}
.wall-item.note{background:var(--note,#ffe27a);color:#3a2d00;border-radius:4px;padding:9px 11px;font-size:13px;font-weight:600;transform:rotate(var(--rot,-2deg));min-width:84px;word-break:break-word;line-height:1.35}
.wall-item.note .by{display:block;font-size:10px;opacity:.6;margin-top:4px}
.wall-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.wall-toolbar button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px}
.sticker-pick{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.sticker-pick button{font-size:26px;padding:6px;border-radius:9px}
.sticker-pick button:active{background:var(--panel2)}

/* 모달 */
.modal{position:fixed;inset:0;z-index:150;background:rgba(5,8,18,.82);backdrop-filter:blur(6px);display:grid;place-items:center;padding:18px}
.modal-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px;max-height:88svh;overflow:auto}
.modal-card h3{margin:0 0 14px;font-size:18px}
.modal-card .btn{margin-top:14px}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
.modal-card{animation:pop .2s ease}

/* 전체화면 게임/배틀 */
.screen{position:fixed;inset:0;z-index:120;background:var(--bg);display:flex;flex-direction:column;padding-top:var(--st);padding-bottom:var(--sb)}
.sc-top{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sc-top h2{margin:0;font-size:17px;flex:1}
.sc-body{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center;gap:14px}
.stage{width:100%;max-width:440px;margin:0 auto}
.statbar{display:flex;gap:18px;justify-content:center;font-size:14px;color:var(--muted)}
.statbar b{color:var(--ink);font-size:20px;font-variant-numeric:tabular-nums}
.tap-area{width:100%;max-width:440px;height:240px;border-radius:18px;display:grid;place-items:center;font-size:22px;font-weight:800;user-select:none;border:1px solid var(--line)}
.hint{color:var(--muted);font-size:14px}
canvas.game{background:#070b16;border-radius:14px;border:1px solid var(--line);touch-action:none}
.big-title{font-size:30px;font-weight:900;letter-spacing:-.5px}
.code-box{font-size:34px;font-weight:900;letter-spacing:6px;color:var(--cyan);background:#0e1430;border:1px dashed var(--cyan);border-radius:14px;padding:14px;margin:10px 0}
.player-chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:10px 0}
.pchip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:700}
.rank-list{text-align:left;width:100%;max-width:400px;margin:0 auto}
.rank-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;margin-bottom:6px;background:var(--panel)}
.rank-row.me{background:rgba(34,224,214,.12);border:1px solid rgba(34,224,214,.3)}
.rank-row .rk{width:30px;text-align:center;font-weight:900;color:var(--muted)}
.rank-row:nth-child(1) .rk{color:var(--yellow)}
.rank-row .nm{flex:1;font-weight:700}
.rank-row .nm small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.rank-row .pt{font-weight:900;color:var(--cyan);font-variant-numeric:tabular-nums}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;width:100%}
.pick-item{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.pick-item.on{border-color:var(--cyan);background:rgba(34,224,214,.1)}
.pick-item .pe{font-size:30px}
.pick-item .pn{font-size:14px;font-weight:700;margin-top:6px}
.pick-item .pd{font-size:11px;color:var(--muted);margin-top:2px}
.countdown{font-size:70px;font-weight:900;color:var(--yellow)}
.trivia-opt{display:block;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;font-size:17px;font-weight:700;margin-bottom:10px;text-align:left}
.trivia-opt.correct{background:rgba(61,220,132,.2);border-color:var(--green)}
.trivia-opt.wrong{background:rgba(255,77,94,.2);border-color:var(--red)}
.trivia-opt:disabled{opacity:.8}
</style>
</head>
<body>

<!-- 로그인 -->
<section id="auth">
  <div class="auth-card">
    <div class="logo-big">🏫</div>
    <h1>우리반 광장</h1>
    <div class="sub">친구들과 퀴즈 배틀 · 게시판 꾸미기</div>
    <div class="field">
      <label>닉네임 <span class="small">(게임에서 크게 보여요)</span></label>
      <input id="nickInput" maxlength="10" placeholder="예: 번개맨" autocomplete="off">
    </div>
    <div class="field">
      <label>이름 <span class="small">(작게 표시 · 누군지 알아보게)</span></label>
      <input id="nameInput" maxlength="10" placeholder="예: 김민수" autocomplete="off">
    </div>
    <button class="btn" id="startBtn">광장 입장</button>
  </div>
</section>

<!-- 광장 -->
<main id="plaza" class="wrap hidden">
  <div class="topbar">
    <h2>🏫 우리반 광장</h2>
    <div class="me-chip"><span class="me-nick" id="meNick"></span><span class="me-name" id="meName"></span></div>
    <button class="ghost-x" id="logoutBtn">나가기</button>
  </div>
  <div class="plaza-hero">
    <div class="logo-big">🏫</div>
    <h1>어디로 갈까?</h1>
    <p>친구들과 같이 즐겨요</p>
  </div>
  <div class="dest">
    <button class="dest-card dest-quiz" data-go="quiz">
      <div class="emoji">⚔️</div><h3>퀴즈 배틀</h3>
      <p>방 코드로 모여서, 여러 미니게임을 라운드로 다 같이 대결!</p>
    </button>
    <button class="dest-card dest-board" data-go="board">
      <div class="emoji">📌</div><h3>게시판</h3>
      <p>투표 · D-day · 스티커/쪽지 꾸미기. 친구들과 실시간으로 채워가요.</p>
    </button>
  </div>
  <p class="sync" id="syncTag"></p>
</main>

<!-- 게시판 -->
<main id="board" class="wrap hidden">
  <div class="topbar">
    <button class="ghost-x" data-back>← 광장</button>
    <h2>📌 게시판</h2>
    <div class="me-chip"><span class="me-nick" id="bNick"></span></div>
  </div>
  <div class="tabs">
    <button data-btab="wall" class="on">🎨 꾸미기</button>
    <button data-btab="poll">🗳️ 투표</button>
    <button data-btab="dday">📅 D-day</button>
  </div>
  <section id="b_wall">
    <div class="wall-toolbar">
      <button data-wall="note">📝 쪽지 붙이기</button>
      <button data-wall="sticker">✨ 스티커</button>
      <span class="chip" style="margin-left:auto">🖐️ 끌어서 옮기기</span>
    </div>
    <div id="wall"></div>
    <p class="hint" style="margin-top:8px">꾹 눌러서 끌면 옮겨지고, 두 번 탭하면 지워요(내가 붙인 것).</p>
  </section>
  <section id="b_poll" hidden>
    <button class="btn sm" id="newPollBtn" style="margin-bottom:12px">+ 새 투표 만들기</button>
    <div id="pollList"></div>
  </section>
  <section id="b_dday" hidden>
    <button class="btn sm" id="newDdayBtn" style="margin-bottom:12px">+ D-day 추가</button>
    <div id="ddayList"></div>
  </section>
  <p class="sync" id="boardSync"></p>
</main>

<!-- 퀴즈 배틀 -->
<main id="quiz" class="wrap hidden"></main>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
'use strict';
/* =======================================================================
   우리반 광장 — 퀴즈 배틀 + 게시판(투표·D-day·꾸미기)
   서버: 아래 두 줄에 Supabase 주소/anon 키 (타이포 앱과 같은 서버 OK).
   비우면 이 기기 안에서만(여러 탭끼리) 동작. 표는 class_setup.sql 참고.
   ======================================================================= */
const SUPABASE_URL = 'https://uziciteusfmbreuizudi.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV6aWNpdGV1c2ZtYnJldWl6dWRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4OTM4NjAsImV4cCI6MjEwNzQ2OTg2MH0.ogXVIA347KqKnpzR6B3X0c1e4xkH6Mkja0rpC-K_2Bk';

/* ---------- 유틸 ---------- */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const el = (t,c,h) => { const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; };
const rand=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rand(a,b+1));
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sleep = ms => new Promise(r=>setTimeout(r,ms));
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1900); }
function code4(){ const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<4;i++)s+=c[ri(0,c.length-1)]; return s; }

/* ---------- 네트워크 계층 (Supabase 폴링 + 로컬 대체) ----------
   roomSet/roomGet: 배틀 방 상태(호스트만 씀) · emit/pull: 참가자 이벤트
   boardList/boardAdd/boardUpdate/boardDel: 게시판 아이템(투표·dday·쪽지·스티커·표) */
const Net = {
  sb:null, online:false, bc:null,
  async init(){
    if(SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase){
      try{ this.sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY); this.online=true; }catch(e){ this.online=false; }
    }
    if(!this.online){ try{ this.bc=new BroadcastChannel('cls'); }catch(e){} }
  },
  // ---- 로컬 저장 헬퍼 ----
  _lget(k,d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d; }catch(e){ return d; } },
  _lset(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} if(this.bc) try{ this.bc.postMessage(k); }catch(e){} },
  // ---- 배틀 방 ----
  async roomSet(code,data){
    data=JSON.parse(JSON.stringify(data));
    if(this.online){ await this.sb.from('cls_rooms').upsert({code,data,updated_at:new Date().toISOString()}); return; }
    this._lset('cls_room_'+code, data);
  },
  async roomGet(code){
    if(this.online){ const q=await this.sb.from('cls_rooms').select('data').eq('code',code).maybeSingle(); return q.data?q.data.data:null; }
    return this._lget('cls_room_'+code, null);
  },
  async emit(code,data){
    const ev={code, data, ts:Date.now()+Math.random()};
    if(this.online){ await this.sb.from('cls_events').insert({code, data}); return; }
    const L=this._lget('cls_ev_'+code, []); L.push(ev); this._lset('cls_ev_'+code, L.slice(-500));
  },
  async pull(code, since){
    if(this.online){ const q=await this.sb.from('cls_events').select('id,data,created_at').eq('code',code).gt('id', since||0).order('id'); return (q.data||[]).map(r=>({id:r.id,data:r.data,ts:Date.parse(r.created_at)})); }
    const L=this._lget('cls_ev_'+code, []); return L.filter(e=>e.ts>(since||0)).map(e=>({id:e.ts,data:e.data,ts:e.ts}));
  },
  // ---- 게시판 ----
  async boardList(){
    if(this.online){ const q=await this.sb.from('cls_board').select('*').order('id'); return (q.data||[]).map(r=>({id:r.id,kind:r.kind,data:r.data,nick:r.by_nick,name:r.by_name})); }
    return this._lget('cls_board', []);
  },
  async boardAdd(kind,data,nick,name){
    if(this.online){ const q=await this.sb.from('cls_board').insert({kind,data,by_nick:nick,by_name:name}).select('id').single(); return q.data?q.data.id:null; }
    const L=this._lget('cls_board', []); const id='b'+Date.now()+Math.floor(Math.random()*999); L.push({id,kind,data,nick,name}); this._lset('cls_board', L); return id;
  },
  async boardUpdate(id,data){
    if(this.online){ await this.sb.from('cls_board').update({data}).eq('id',id); return; }
    const L=this._lget('cls_board', []); const it=L.find(x=>x.id===id); if(it){ it.data=data; this._lset('cls_board', L); }
  },
  async boardDel(id){
    if(this.online){ await this.sb.from('cls_board').delete().eq('id',id); return; }
    this._lset('cls_board', this._lget('cls_board', []).filter(x=>x.id!==id));
  },
  // 폴링 구독
  poll(fn, ms){ fn(); const iv=setInterval(fn, ms); const stop=()=>clearInterval(iv);
    if(this.bc){ const h=()=>fn(); this.bc.addEventListener('message',h); return ()=>{ stop(); this.bc.removeEventListener('message',h); }; }
    return stop;
  }
};

   게시판: 꾸미기(벽) · 투표 · D-day  — 모두 실시간 폴링

const Board = {
  items:[], stop:null, tab:'wall', dragging:null,
  bind(){
    $$('[data-btab]').forEach(b=>b.onclick=()=>this.setTab(b.dataset.btab));
    $$('[data-wall]').forEach(b=>b.onclick=()=>this.addWall(b.dataset.wall));
    $('#newPollBtn').onclick=()=>this.newPoll();
    $('#newDdayBtn').onclick=()=>this.newDday();
    this.wallDrag();
  },
  open(){
    $('#boardSync').innerHTML = Net.online?'실시간 공유 중 <span class="on">●</span>':'이 기기에서만 <span class="off">●</span>';
    this.stop = Net.poll(()=>this.refresh(), Net.online?1500:400);
  },
  close(){ if(this.stop){ this.stop(); this.stop=null; } },
  setTab(t){ this.tab=t; $$('[data-btab]').forEach(b=>b.classList.toggle('on',b.dataset.btab===t));
    ['wall','poll','dday'].forEach(x=>$('#b_'+x).hidden = x!==t); this.render(); },
  async refresh(){ this.items=await Net.boardList(); this.render(); },
  render(){ if(this.tab==='wall')this.renderWall(); else if(this.tab==='poll')this.renderPolls(); else this.renderDday(); },

  /* ---- 꾸미기 벽 ---- */
  renderWall(){
    const wall=$('#wall'); const keep=this.dragging&&this.dragging.id;
    wall.querySelectorAll('.wall-item').forEach(n=>{ if(n.dataset.id!==keep) n.remove(); });
    this.items.filter(i=>i.kind==='note'||i.kind==='sticker').forEach(it=>{
      if(it.id===keep) return;
      let n=wall.querySelector(`.wall-item[data-id="${CSS.escape(String(it.id))}"]`);
      if(!n){ n=el('div','wall-item '+it.kind); n.dataset.id=it.id; wall.appendChild(n);
        n.addEventListener('pointerdown',e=>this.grab(e,it,n));
        let lastTap=0; n.addEventListener('pointerup',()=>{ const now=Date.now(); if(now-lastTap<350) this.delItem(it); lastTap=now; }); }
      if(it.kind==='sticker'){ n.textContent=it.data.emoji; }
      else { n.style.setProperty('--note',it.data.color||'#ffe27a'); n.style.setProperty('--rot',(it.data.rot||-2)+'deg');
        n.innerHTML=esc(it.data.text)+`<span class="by">— ${esc(it.nick||'')}</span>`; }
      const W=wall.clientWidth,H=wall.clientHeight;
      n.style.left=(it.data.x*W)+'px'; n.style.top=(it.data.y*H)+'px';
    });
  },
  async addWall(kind){
    if(kind==='note'){
      const text=await Modal.prompt('쪽지 내용','하고 싶은 말을 적어요',{multiline:true,max:80}); if(!text)return;
      const colors=['#ffe27a','#a0e7a0','#ffb3c6','#a9d3ff','#d9b3ff'];
      await Net.boardAdd('note',{text:text.slice(0,80),x:rand(.08,.6),y:rand(.08,.7),color:colors[ri(0,colors.length-1)],rot:ri(-5,5)},this.nick(),App.name);
    } else {
      const emoji=await Modal.sticker(); if(!emoji)return;
      await Net.boardAdd('sticker',{emoji,x:rand(.1,.75),y:rand(.1,.75)},this.nick(),App.name);
    }
    this.refresh();
  },
  nick(){ return App.nick; },
  grab(e,it,n){ e.preventDefault(); n.setPointerCapture&&n.setPointerCapture(e.pointerId); n.style.cursor='grabbing';
    const wall=$('#wall'),W=wall.clientWidth,H=wall.clientHeight,r=n.getBoundingClientRect();
    this.dragging={id:it.id, dx:e.clientX-r.left, dy:e.clientY-r.top, it, n, moved:false};
  },
  wallDrag(){
    const move=e=>{ const d=this.dragging; if(!d)return; d.moved=true; const wall=$('#wall'),W=wall.clientWidth,H=wall.clientHeight,wr=wall.getBoundingClientRect();
      let x=(e.clientX-wr.left-d.dx)/W, y=(e.clientY-wr.top-d.dy)/H; x=Math.max(0,Math.min(.92,x)); y=Math.max(0,Math.min(.92,y));
      d.it.data.x=x; d.it.data.y=y; d.n.style.left=(x*W)+'px'; d.n.style.top=(y*H)+'px'; };
    const up=async e=>{ const d=this.dragging; if(!d)return; this.dragging=null; d.n.style.cursor='grab';
      if(d.moved){ await Net.boardUpdate(d.it.id,d.it.data); this.refresh(); } };
    window.addEventListener('pointermove',move); window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up);
  },
  async delItem(it){ if(it.nick && it.nick!==App.nick){ toast('내가 붙인 것만 지울 수 있어요'); return; }
    if(!confirm('지울까요?'))return; await Net.boardDel(it.id); this.refresh(); },

  /* ---- 투표 ---- */
  renderPolls(){
    const box=$('#pollList'); const polls=this.items.filter(i=>i.kind==='poll');
    const votes=this.items.filter(i=>i.kind==='vote');
    if(!polls.length){ box.innerHTML='<div class="empty">아직 투표가 없어요.<br>위 버튼으로 첫 투표를 만들어 보세요!</div>'; return; }
    box.innerHTML='';
    polls.slice().reverse().forEach(p=>{
      const myVote=votes.find(v=>v.data.poll===p.id && v.nick===App.nick);
      const counts=p.data.options.map((_,i)=>votes.filter(v=>v.data.poll===p.id && v.data.choice===i).length);
      const total=counts.reduce((a,b)=>a+b,0);
      const c=el('div','card poll');
      c.innerHTML=`<div class="q">${esc(p.data.q)}</div>`+
        p.data.options.map((o,i)=>`<div class="opt ${myVote&&myVote.data.choice===i?'mine':''}"><div class="fill" style="width:${total?counts[i]/total*100:0}%"></div><button class="pick" data-i="${i}">${esc(o)}</button><span class="cnt">${counts[i]}</span></div>`).join('')+
        `<div class="meta"><span>${total}명 참여 · ${esc(p.nick||'')} 만듦</span>${p.nick===App.nick?'<button data-del style="color:var(--red)">삭제</button>':''}</div>`;
      c.querySelectorAll('.pick').forEach(b=>b.onclick=()=>this.vote(p,+b.dataset.i,myVote));
      const del=c.querySelector('[data-del]'); if(del)del.onclick=async()=>{ if(confirm('투표를 지울까요?')){ await Net.boardDel(p.id); for(const v of votes.filter(v=>v.data.poll===p.id)) await Net.boardDel(v.id); this.refresh(); } };
      box.appendChild(c);
    });
  },
  async vote(p,i,myVote){
    if(myVote){ if(myVote.data.choice===i)return; myVote.data.choice=i; await Net.boardUpdate(myVote.id,myVote.data); }
    else await Net.boardAdd('vote',{poll:p.id,choice:i},App.nick,App.name);
    this.refresh();
  },
  async newPoll(){
    const r=await Modal.poll(); if(!r)return;
    await Net.boardAdd('poll',{q:r.q,options:r.options},App.nick,App.name); this.setTab('poll'); this.refresh();
  },

  /* ---- D-day ---- */
  renderDday(){
    const box=$('#ddayList'); const list=this.items.filter(i=>i.kind==='dday');
    if(!list.length){ box.innerHTML='<div class="empty">아직 D-day가 없어요.<br>소풍·방학·시험 날짜를 추가해 보세요!</div>'; return; }
    const today=new Date(); today.setHours(0,0,0,0);
    box.innerHTML='';
    list.map(it=>{ const d=new Date(it.data.date+'T00:00:00'); const diff=Math.round((d-today)/864e5); return {it,diff,d}; })
      .sort((a,b)=>Math.abs(a.diff)-Math.abs(b.diff)).forEach(({it,diff,d})=>{
      const label = diff===0?'D-DAY':(diff>0?'D-'+diff:'D+'+(-diff));
      const c=el('div','card dday');
      c.innerHTML=`<div class="num ${diff<0?'past':''}">${label}</div><div class="info"><b>${esc(it.data.title)}</b><div class="date">${it.data.date} · ${esc(it.nick||'')}</div></div>${it.nick===App.nick?'<button class="ghost-x" data-del>✕</button>':''}`;
      const del=c.querySelector('[data-del]'); if(del)del.onclick=async()=>{ if(confirm('지울까요?')){ await Net.boardDel(it.id); this.refresh(); } };
      box.appendChild(c);
    });
  },
  async newDday(){
    const r=await Modal.dday(); if(!r)return;
    await Net.boardAdd('dday',{title:r.title,date:r.date},App.nick,App.name); this.setTab('dday'); this.refresh();
  }
};

const Modal = {
  _open(html){ return new Promise(res=>{ const m=el('div','modal'); m.innerHTML=`<div class="modal-card">${html}</div>`; document.body.appendChild(m);
    m.addEventListener('click',e=>{ if(e.target===m){ m.remove(); res(null); } });
    m._done=v=>{ m.remove(); res(v); }; m._el=q=>m.querySelector(q); window._m=m; }); },
  async prompt(title,ph,opt={}){ const p=this._open(`<h3>${esc(title)}</h3>${opt.multiline?`<textarea id="mi" rows="3" maxlength="${opt.max||120}" placeholder="${esc(ph||'')}"></textarea>`:`<input id="mi" maxlength="${opt.max||40}" placeholder="${esc(ph||'')}">`}<button class="btn" id="mok">확인</button>`);
    const m=window._m; m._el('#mi').focus(); m._el('#mok').onclick=()=>m._done(m._el('#mi').value.trim()); return p; },
  async sticker(){ const p=this._open(`<h3>스티커 고르기</h3><div class="sticker-pick">${'❤️🔥⭐😂👍🎉🌈🍕🐶🐱🚀⚽🎮🏆👑💎🌸🎈🦄✨😎🥳💯🎯'.match(/./gu).map(e=>`<button data-e="${e}">${e}</button>`).join('')}</div>`);
    const m=window._m; m.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>m._done(b.dataset.e)); return p; },
  async poll(){ const p=this._open(`<h3>새 투표</h3><div class="field"><label>질문</label><input id="pq" maxlength="60" placeholder="예: 우리 반 소풍 어디 갈까?"></div><div class="field"><label>보기 (한 줄에 하나)</label><textarea id="po" rows="4" placeholder="놀이공원\n수목원\n박물관"></textarea></div><button class="btn" id="pok">만들기</button>`);
    const m=window._m; m._el('#pq').focus(); m._el('#pok').onclick=()=>{ const q=m._el('#pq').value.trim(); const options=m._el('#po').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,6); if(!q||options.length<2){ toast('질문과 보기 2개 이상 필요해요'); return; } m._done({q,options}); }; return p; },
  async dday(){ const t=new Date(); const def=new Date(t.getTime()+7*864e5).toISOString().slice(0,10);
    const p=this._open(`<h3>D-day 추가</h3><div class="field"><label>이름</label><input id="dt" maxlength="24" placeholder="예: 여름방학"></div><div class="field"><label>날짜</label><input id="dd" type="date" value="${def}"></div><button class="btn" id="dok">추가</button>`);
    const m=window._m; m._el('#dt').focus(); m._el('#dok').onclick=()=>{ const title=m._el('#dt').value.trim(), date=m._el('#dd').value; if(!title||!date){ toast('이름과 날짜를 넣어 주세요'); return; } m._done({title,date}); }; return p; }
};

  open(){ this.reset(); this.home(); },
  close(){ if(this.loopStop){this.loopStop();this.loopStop=null;} },
  reset(){ this.code=''; this.isHost=false; this.games=[]; this.playedRound=-1; this.revealedRound=-1; this.endedShown=false; this.cursor=0; this.roundScores={}; this.knownPlayers={}; if(this.loopStop){this.loopStop();this.loopStop=null;} },
  wrap(title,body){ $('#quiz').innerHTML=`<div class="topbar"><button class="ghost-x" id="bq_back">← 광장</button><h2>${title}</h2></div>${body}`; $('#bq_back').onclick=()=>{ if(this.code && !confirm('배틀에서 나갈까요?'))return; App.go('plaza'); }; },

  home(){
    this.wrap('⚔️ 퀴즈 배틀', `
      <div class="plaza-hero" style="padding:8px 0 18px"><div class="logo-big" style="width:60px;height:60px;font-size:32px;background:linear-gradient(135deg,#7b3dff,#ff3d8b)">⚔️</div><h1 style="font-size:22px">친구들과 대결!</h1><p>한 명이 방을 만들고, 나머지는 코드로 들어와요</p></div>
      <button class="btn" id="bq_create" style="margin-bottom:12px">🎮 방 만들기 (대장)</button>
      <button class="btn ghost" id="bq_join">🚪 코드로 참가하기</button>`);
    $('#bq_create').onclick=()=>this.pickGames();
    $('#bq_join').onclick=()=>this.joinPrompt();
  },

  pickGames(){
    const ids=Object.keys(BGAMES); const chosen=new Set(ids);
    this.wrap('🎮 게임 고르기', `<p class="muted" style="margin:0 0 12px">라운드로 넣을 게임을 골라요 (고른 순서대로 진행돼요)</p>
      <div class="pick-grid" id="bq_pick">${ids.map(id=>`<button class="pick-item on" data-id="${id}"><div class="pe">${BGAMES[id].emoji}</div><div class="pn">${BGAMES[id].name}</div><div class="pd">${BGAMES[id].desc}</div></button>`).join('')}</div>
      <button class="btn" id="bq_make" style="margin-top:16px">방 만들기 →</button>`);
    $$('#bq_pick .pick-item').forEach(b=>b.onclick=()=>{ const id=b.dataset.id; if(chosen.has(id)){chosen.delete(id);b.classList.remove('on');} else {chosen.add(id);b.classList.add('on');} });
    $('#bq_make').onclick=async()=>{ const sel=ids.filter(id=>chosen.has(id)); if(!sel.length){toast('게임을 하나 이상 골라요');return;}
      this.isHost=true; this.code=code4(); this.games=sel;
      await Net.roomSet(this.code,{phase:'lobby',host:App.nick,games:sel,round:-1,board:[]});
      await Net.emit(this.code,{kind:'join',nick:App.nick,name:App.name});
      this.startLoop(); this.hostLobby(); };
  },
  joinPrompt(){
    this.wrap('🚪 참가하기', `<div class="card"><div class="field"><label>방 코드 4자리</label><input id="bq_code" maxlength="4" placeholder="ABCD" style="text-transform:uppercase;font-size:24px;letter-spacing:4px;text-align:center"></div><button class="btn" id="bq_enter">입장</button></div>`);
    $('#bq_code').focus();
    $('#bq_enter').onclick=async()=>{ const c=$('#bq_code').value.trim().toUpperCase(); if(c.length!==4){toast('코드 4자리를 넣어요');return;}
      const room=await Net.roomGet(c); if(!room){toast('그런 방이 없어요');return;}
      this.isHost=false; this.code=c; this.games=room.games;
      await Net.emit(c,{kind:'join',nick:App.nick,name:App.name});
      this.startLoop(); this.waiting('방에 들어왔어요! 대장이 시작하길 기다려요 ⏳'); };
  },

  startLoop(){ if(this.loopStop)this.loopStop(); this.loopStop=Net.poll(()=>this.tick(),Net.online?800:300); },

  async tick(){
    const room=await Net.roomGet(this.code); if(!room)return;
    // 호스트: 참가 이벤트/점수 수집
    if(this.isHost){
      const evs=await Net.pull(this.code,this.cursor);
      for(const e of evs){ this.cursor=Math.max(this.cursor,e.id); const d=e.data;
        if(d.kind==='join'){ this.knownPlayers[d.nick]=d.name; }
        else if(d.kind==='score'){ (this.roundScores[d.round]=this.roundScores[d.round]||{})[d.nick]=d.score; } }
      if(room.phase==='lobby') this.renderHostLobby(room);
      if(room.phase==='play') this.renderHostWaiting(room);
    } else {
      // 참가자: 상태 반영
      if(room.phase==='lobby') this.waiting('대장이 시작하길 기다려요 ⏳ ('+Object.keys(room.board||[]).length+')');
    }
    // 공통: 라운드 시작되면 1번만 플레이
    if(room.phase==='play' && room.round>this.playedRound){ this.playedRound=room.round; this.playRound(room); }
    if(room.phase==='reveal' && room.round>this.revealedRound){ this.revealedRound=room.round; this.showReveal(room); }
    if(room.phase==='end' && !this.endedShown){ this.endedShown=true; this.showEnd(room); }
  },

  hostLobby(){ this.renderHostLobby(null); },
  renderHostLobby(room){
    const players=Object.entries(this.knownPlayers);
    const sig='lobby:'+players.map(p=>p[0]).join(',');
    if(this._sig===sig && $('#bq_start'))return; this._sig=sig;
    this.wrap('🎮 대기방', `
      <div class="sc-body" style="position:static;padding:8px 0">
        <p class="muted">친구들에게 이 코드를 알려주세요</p>
        <div class="code-box">${this.code}</div>
        <p class="muted">게임 ${this.games.length}라운드 · ${this.games.map(g=>BGAMES[g].emoji).join(' ')}</p>
        <div class="player-chips" id="bq_players">${players.map(([nk,nm])=>`<span class="pchip">${esc(nk)}</span>`).join('')||'<span class="muted">아직 아무도 없어요…</span>'}</div>
        <button class="btn" id="bq_start" style="max-width:320px">시작하기 (${players.length}명)</button>
      </div>`);
    $('#bq_start').onclick=()=>this.startRound(0);
  },
  async startRound(r){ await Net.roomSet(this.code,{phase:'play',host:App.nick,games:this.games,round:r,board:this.boardSoFar()}); },
  boardSoFar(){ return this._lastBoard||[]; },

  async playRound(room){
    const g=BGAMES[room.games[room.round]]; if(!g){return;}
    this.playing=true;
    // 카운트다운 → 15초 플레이
    this.wrap(`⚔️ ${room.round+1}라운드 / ${room.games.length}`, `<div class="sc-body" style="position:static"><div class="big-title">${g.emoji} ${g.name}</div><div class="countdown" id="bq_cd">3</div><p class="hint">${g.desc}</p></div>`);
    for(let c=3;c>=1;c--){ const cd=$('#bq_cd'); if(cd)cd.textContent=c; await sleep(700); }
    const stage=el('div','stage'); const timer=el('div'); timer.style.cssText='height:10px;background:#0d1430;border-radius:999px;overflow:hidden;max-width:440px;margin:0 auto 12px'; const ti=el('div'); ti.style.cssText='height:100%;width:100%;background:linear-gradient(90deg,var(--cyan),var(--purple));transition:width .2s'; timer.appendChild(ti);
    this.wrap(`⚔️ ${room.round+1}라운드`, `<div class="sc-body" id="bq_play" style="position:static"></div>`);
    $('#bq_play').append(timer,stage);
    const getScore=g.run(stage);
    let left=ROUND_SEC*1000; const t0=Date.now();
    await new Promise(res=>{ const iv=setInterval(()=>{ const el2=Date.now()-t0; ti.style.width=Math.max(0,100-el2/(ROUND_SEC*1000)*100)+'%'; if(el2>=ROUND_SEC*1000){ clearInterval(iv); res(); } },100); });
    if(stage._stop)stage._stop();
    const score=getScore()|0;
    const pl=$('#bq_play'); if(pl)pl.id='bq_over';   // 플레이 끝 → 대기/집계 화면이 덮을 수 있게
    this.playing=false; this._sig='';
    await Net.emit(this.code,{kind:'score',round:room.round,nick:App.nick,score});
    if(this.isHost){ this.roundScores[room.round]=this.roundScores[room.round]||{}; this.roundScores[room.round][App.nick]=score; this.renderHostWaiting(room); }
    else this.waiting(`내 점수 ${score}점! 다른 친구들을 기다려요…`);
  },
  renderHostWaiting(room){
    if(this.playing||$('#bq_play'))return; // 아직 플레이/카운트다운 중
    const sc=this.roundScores[room.round]||{}; const done=Object.keys(sc).length, total=Object.keys(this.knownPlayers).length;
    const sig='wait:'+room.round+':'+done+'/'+total+':'+Object.keys(sc).join(',');
    if(this._sig===sig && $('#bq_reveal'))return; this._sig=sig;
    const body=`<div class="sc-body" style="position:static"><div class="big-title">${done} / ${total} 완료</div><p class="muted">모두 끝나면 결과를 공개해요</p>
      <div class="player-chips">${Object.keys(this.knownPlayers).map(nk=>`<span class="pchip" style="${sc[nk]!=null?'border-color:var(--green);color:var(--green)':''}">${esc(nk)} ${sc[nk]!=null?'✓':'…'}</span>`).join('')}</div>
      <button class="btn" id="bq_reveal" style="max-width:320px">결과 공개 →</button></div>`;
    this.wrap(`⚔️ ${room.round+1}라운드 집계`, body);
    $('#bq_reveal').onclick=()=>this.reveal(room);
  },
  async reveal(room){
    const sc=this.roundScores[room.round]||{}; const g=BGAMES[room.games[room.round]];
    // 이번 라운드 등수 → 점수
    const ranked=Object.entries(this.knownPlayers).map(([nk,nm])=>({nk,nm,s:sc[nk]??-1})).sort((a,b)=>b.s-a.s);
    const pts=[100,85,75,68,62,57,53,50,47,45];
    const prev=Object.fromEntries((room.board||[]).map(b=>[b.nick,b.total]));
    ranked.forEach((r,i)=>{ r.round=r.s<0?0:(pts[i]??40); r.total=(prev[r.nk]||0)+r.round; });
    const board=ranked.map(r=>({nick:r.nk,name:this.knownPlayers[r.nk],roundScore:r.s<0?'-':r.s,round:r.round,total:r.total})).sort((a,b)=>b.total-a.total);
    this._lastBoard=board;
    await Net.roomSet(this.code,{phase:'reveal',host:App.nick,games:this.games,round:room.round,board,gameName:g.name});
  },
  showReveal(room){
    const board=room.board||[]; const last=room.round+1>=room.games.length;
    this.wrap(`🏆 ${room.round+1}라운드 결과`, `<div class="sc-body" style="position:static">
      <p class="muted">${esc(room.gameName||'')} · 등수대로 점수 획득</p>
      <div class="rank-list">${board.map((b,i)=>`<div class="rank-row ${b.nick===App.nick?'me':''}"><span class="rk">${i<3?['🥇','🥈','🥉'][i]:i+1}</span><span class="nm">${esc(b.nick)} <small>${esc(b.name||'')} · 이번 ${b.roundScore} (+${b.round})</small></span><span class="pt">${b.total}</span></div>`).join('')}</div>
      ${this.isHost?`<button class="btn" id="bq_next" style="max-width:320px;margin-top:10px">${last?'🏁 최종 결과':'다음 라운드 →'}</button>`:`<p class="hint" style="margin-top:14px">대장이 ${last?'최종 결과를':'다음 라운드를'} 열어요…</p>`}</div>`);
    if(this.isHost){ $('#bq_next').onclick=async()=>{ if(last) await Net.roomSet(this.code,{phase:'end',host:App.nick,games:this.games,round:room.round,board}); else { this.roundScores[room.round+1]={}; await Net.roomSet(this.code,{phase:'play',host:App.nick,games:this.games,round:room.round+1,board}); } }; }
  },
  showEnd(room){
    const board=room.board||[]; const win=board[0];
    this.wrap('🏁 최종 결과', `<div class="sc-body" style="position:static">
      <div style="font-size:60px">🏆</div><div class="big-title">${win?esc(win.nick):''} 우승!</div><p class="muted">${win?esc(win.name||''):''}</p>
      <div class="rank-list" style="margin-top:14px">${board.map((b,i)=>`<div class="rank-row ${b.nick===App.nick?'me':''}"><span class="rk">${i<3?['🥇','🥈','🥉'][i]:i+1}</span><span class="nm">${esc(b.nick)} <small>${esc(b.name||'')}</small></span><span class="pt">${b.total}</span></div>`).join('')}</div>
      <button class="btn" id="bq_home" style="max-width:320px;margin-top:16px">광장으로</button></div>`);
    $('#bq_home').onclick=()=>App.go('plaza');
  },
  waiting(msg){ if($('#bq_play'))return; const sig='wait-msg:'+msg; if(this._sig===sig)return; this._sig=sig; this.wrap('⚔️ 퀴즈 배틀', `<div class="sc-body" style="position:static"><div style="font-size:50px">⏳</div><p class="muted" style="max-width:320px">${esc(msg)}</p></div>`); }
};

App.boot();
</script>
</body>
</html>
